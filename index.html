  const fine  =(typeof matchMedia==='function')&&matchMedia('(any-pointer: fine)').matches;
  const touch =('ontouchstart' in window)||((navigator.maxTouchPoints||0)>0);
  const on=touch&&coarse&&!fine;                     // phone/tablet yes, laptop+mouse no
  if(document.body&&document.body.classList)
    document.body.classList[on?'add':'remove']('touch');
}

  const el=document.getElementById(id);

  const off=e=>{e.preventDefault();keys[key]=0;};
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointerleave',off);
  el.addEventListener('pointercancel',off);
}

// (press past 10/14px from center, release only inside 4/6px) for stability.
const dp=document.getElementById('dp');
let dpOn=false;
function dpSet(e){
  const r=dp.getBoundingClientRect();
  const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  keys.l   = dx < -(keys.l  ?4:10) ?1:0;
  keys.r   = dx >  (keys.r  ?4:10) ?1:0;
  keys.up  = dy < -(keys.up ?6:14) ?1:0;
  keys.down= dy >  (keys.down?6:14)?1:0;
}

  e.preventDefault(); initAudio();
  dp.setPointerCapture(e.pointerId);
  dpOn=true; dpSet(e);
});
dp.addEventListener('pointermove',e=>{ if(dpOn)dpSet(e); });

// gamepad: SNES muscle memory + twin-stick right-stick aim
let padSource=()=>((typeof navigator!=='undefined'&&navigator.getGamepads)?navigator.getGamepads():[]);
let padIx=-1;
const padK={l:0,r:0,up:0,down:0,jump:0,fire:0,act:0,inv:0,start:0,pause:0};
const PADMAP=[['jump',[0]],['act',[1]],['fire',[2,5,7]],['inv',[3]],
              ['start',[9]],['pause',[8]]];
function pollPad(){
  const pads=padSource(); let gp=null;
  for(const p of pads)if(p&&p.connected!==false){ gp=p; padIx=p.index; break; }
  if(!gp){
    for(const k in padK)if(padK[k]){ padK[k]=0; keys[k]=0; }
    return;
  }
  const want={l:0,r:0,up:0,down:0,jump:0,fire:0,act:0,inv:0,start:0,pause:0};
  const bt=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
  for(const [k,ids] of PADMAP)for(const i of ids)if(bt(i))want[k]=1;
  if(bt(14))want.l=1; if(bt(15))want.r=1;
  if(bt(12))want.up=1; if(bt(13))want.down=1;
  const ax=gp.axes||[];
  if(ax[0]<-0.25)want.l=1;  if(ax[0]>0.25)want.r=1;
  if(ax[1]<-0.35)want.up=1; if(ax[1]>0.35)want.down=1;
  for(const k in want){
    if(want[k]&&!padK[k]){ padK[k]=1; keys[k]=1; }
    else if(!want[k]&&padK[k]){ padK[k]=0; keys[k]=0; }
  }
  const rx=ax[2]||0, ry=ax[3]||0;                  // right stick -> cursor-aim path
  if(Math.hypot(rx,ry)>0.35 && typeof P!=='undefined' && P){
    mouse.on=true; mouse.t=tick;
    const cx2=state==='horde'?hCamX:cam, cy2=state==='horde'?hCamY:0;
    mouse.x=(P.x-cx2)+6+rx*44;
    mouse.y=(P.y-cy2)+10+ry*44;
    if(bt(7)||bt(5))mouse.down=1; else if(!padK.fire)mouse.down=0;
  }
}
function rumble(ms,strong,weak){
  try{
    const gp=padSource()[padIx];
    const va=gp&&gp.vibrationActuator;
    if(va&&va.playEffect)
      va.playEffect('dual-rumble',{duration:ms,strongMagnitude:strong,weakMagnitude:weak});
  }catch(e){}
}

// MIDI MODE: play ze synth, fight ze Reich (hidden: code LRLRUD)
let midiMode=false;
const MIDIMAP={0:'l',2:'r',4:'jump',5:'fire',7:'act',9:'inv',11:'pause',1:'up',3:'down'};
function onMIDI(m){
  if(!midiMode)return;
  const d=m.data; if(!d||d.length<3)return;
  const cmd=d[0]&0xf0, note=d[1], vel=d[2];
  if(cmd!==0x90&&cmd!==0x80)return;
  const on=(cmd===0x90&&vel>0)?1:0;
  const k=MIDIMAP[note%12];
  if(k)keys[k]=on;
}
function initMIDI(){
  if(typeof navigator==='undefined'||!navigator.requestMIDIAccess){
    showLine('NO WEB MIDI IN THIS BROWSER'); return;
  }
  navigator.requestMIDIAccess().then(acc=>{
    showLine('MIDI LINKED: C=LEFT D=RIGHT E=JUMP F=FIRE');
    for(const inp of acc.inputs.values())inp.onmidimessage=onMIDI;
    acc.onstatechange=e=>{
      if(e.port&&e.port.type==='input'&&e.port.state==='connected')
        e.port.onmidimessage=onMIDI;
    };
  },()=>showLine('MIDI ACCESS DENIED'));
}

/* Cinematic cue for splash + intro: low drone swells, deep pulses, eerie pings */
function galSynthStep(s,t){ // NEON GALLERY: lush 111bpm, blooms as ze ops escalate
  const inten=galLvl+(galScene>=2?1:0);              // 0..4 intensity ladder
  const prog=[[0,3,7,10,14],[8,12,15,19,22],[5,8,12,15],[10,14,17,22]];
  const ch=prog[(s>>6)%4], root=ch[0];
  if(s%64===0)for(const n of ch)padChord([n+12],t);  // wide m9 wash
  if(s%64===32)padChord([ch[1]+12,ch[2]+12,ch[3]+12],t);
  if(s%8===0)synthBass(E1*2*Math.pow(2,root/12),t);
  if(inten>=1&&s%8===4)synthBass(E1*2*Math.pow(2,(root+(s%32===20?7:0))/12),t);
  if(s%8===0)kickD(t);
  if(inten>=1&&s%4===2)noiseHit(t,'highpass',6800,0.028,0.06);
  if(inten>=2&&s%2===1)noiseHit(t,'highpass',7600,0.02,0.05);
  if(s%32===16)snareD(t);
  if(inten>=2&&s%16===8)snareD(t);
  if(inten>=1&&s%4===0)
    arpN(E2*2*Math.pow(2,ch[(s>>2)%ch.length]/12),t,{arpWave:'triangle',arpOct:1});
  if(inten>=3&&s%2===0)
    arpN(E2*4*Math.pow(2,ch[(s>>1)%ch.length]/12),t,{arpWave:'square',arpOct:0});
  if(inten>=3&&s%64===48)leadN(E2*Math.pow(2,(root+14)/12),t,0.6);
  if(inten>=4&&s%32===28)leadN(E2*Math.pow(2,(root+19)/12),t,0.3);
}
function hordeSynthStep(s,t){ // LOBSTER DISCO: groovy, loopable, keeps ze legs moving
  const roots=[0,0,3,5], root=roots[(s>>5)%4];
  if(s%4===0)kickD(t);
  if(s%8===4)snareD(t);
  if(s%2===1)noiseHit(t,'highpass',7000,0.03,0.09);
  if(s%16===14)noiseHit(t,'highpass',5200,0.06,0.07);
  const BL=[0,null,12,null, 0,10,null,7, 0,null,12,null, 5,null,7,10];
  const bn=BL[s%16];
  if(bn!=null)synthBass(E1*2*Math.pow(2,(root+bn)/12),t);
  if(s%32===0)padChord([root+12,root+15,root+19,root+22],t);
  if(s%32===16)padChord([root+12,root+17,root+19],t);
  if((s>>4)%2===1&&s%2===0)
    arpN(E2*2*Math.pow(2,(root+[0,3,7,12,15,12,7,3][(s>>1)%8])/12),t,
         {arpWave:'square',arpOct:1});
  if(s%64===56)leadN(E2*Math.pow(2,(root+19)/12),t,0.5);
}
function doomSynthStep(s,t){ // splash+intro: doom swells over a driving pulse
  const roots=[0,0,8,1], root=roots[(s>>5)%4];       // E - E - C - F: ze dread cadence
  if(s%4===0)kickD(t);                               // four-on-ze-floor, relentless
  if(s%16===8)snareD(t);
  if(s%2===1)noiseHit(t,'highpass',6500,0.04,0.1);   // offbeat hat pulse
  if(s%2===0)synthBass(E1*2*Math.pow(2,(root+(s%16===14?12:0))/12),t); // driving 8ths + octave stab
  if(s%64===0){ const f=E1*Math.pow(2,root/12); swell(f,t); swell(f*1.4983,t+0.06); }
  if(s%32===16)padChord([root+12,root+15,root+19],t);
  if((s>>5)%4===3 && s%4===0)                        // bar 4: descending dread arp
    arpN(E2*Math.pow(2,(root+[24,22,19,15][(s>>2)%4])/12),t,{arpWave:'sawtooth',arpOct:1});
  if(s%64===40)eerie(t);
}
function cineStep(s,t){
  if(s%64===0){ swell(E1,t); swell(E1*1.4983,t+0.03); }
  if(s%16===0) deepPulse(t);
  if(s%32===24 && Math.random()<0.6) eerie(t);
}
function swell(f,t){
  const g=AC.createGain(), lp=AC.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.value=240;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.09,t+1.3);
  g.gain.linearRampToValueAtTime(0.0001,t+2.7);
  for(const dt of [-5,5]){
    const o=AC.createOscillator();
    o.type='sawtooth'; o.frequency.value=f; o.detune.value=dt;
    o.connect(lp); o.start(t); o.stop(t+2.8);
  }
  lp.connect(g); g.connect(master);
}
function deepPulse(t){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(56,t);
  o.frequency.exponentialRampToValueAtTime(40,t+0.22);
  g.gain.setValueAtTime(0.22,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.25);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.26);
}
function eerie(t){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(880,t);
  o.frequency.linearRampToValueAtTime(1420,t+0.8);
  g.gain.setValueAtTime(0.028,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.85);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+0.9);
}

function initAudio(){
  if(AC)return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.connect(AC.destination); setVol();
  // lead bus with feedback delay for epic solos
  leadBus=AC.createGain(); leadBus.gain.value=1; leadBus.connect(master);
  const dl=AC.createDelay(0.6); dl.delayTime.value=0.26;
  const fb=AC.createGain(); fb.gain.value=0.3;
  const wet=AC.createGain(); wet.gain.value=0.26;
  leadBus.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  mNextT=AC.currentTime+0.06;
  setInterval(schedMusic,25);
}
function setVol(){ if(master)master.gain.value=0.55*opt.vol/10; }
function curSongIdx(){
  if(opt.music>=0 && songUnlocked(opt.music)) return opt.music;
  if(state==='horde'||state==='hwin'||state==='hover')return 7; // Klone Kommand: arena tempo
  if(state==='gal')return GLV[galLvl].theme;
  return (LEVELS[LVL]&&LEVELS[LVL].theme!=null)?LEVELS[LVL].theme:3;
}
function curBPM(){
  if(state==='splash'||state==='intro')return 112;   // doom synthwave
  if(state==='menu'||state==='charsel'||state==='vault'||state==='lvlsel'||state==='shop'||state==='ach'||state==='depot'||state==='optmenu'||state==='sound'||state==='merch'||state==='credits'||state==='hboard'||state==='galsel')return 104; // synthwave
  if(state==='post')return 120;
  if(state==='lvlwin'||state==='win')return 140;     // anthem
  if((state==='play'||state==='horde')&&typeof P!=='undefined'&&P&&P.star>0)return 140; // ze star anthem
  if(state==='over')return 60;                       // doom
  if(state==='pause')return 120;
  if(state==='play'&&typeof boss!=='undefined'&&boss&&!boss.dead)return 168; // boss
  if(state==='horde')return 122;                     // lobster disco
  if(state==='gal')return 111;                       // lush gallery synthwave
  if(state==='galwin')return 140;
  if(state==='galover')return 60;
  if(state==='play')return SONGS[curSongIdx()].bpm;
  return 120;
}
function stOf(){ return 60/curBPM()/4; }
function schedMusic(){
  if(!AC)return;
  while(mNextT<AC.currentTime+0.12){
    try{ playStep(mStep,mNextT); }
    catch(e){                                        // one bad note must not kill ze band
      if(!schedMusic.warned){ schedMusic.warned=1;
        console.log('MUSIC STEP ERROR:',e.message,e.stack); }
    }
    mStep++; mNextT+=stOf();
  }
}
window.addEventListener('error',e=>{               // surface real errors for bug reports
  try{ console.log('MHMD ERR:',e.message,'@',e.filename+':'+e.lineno,
       e.error&&e.error.stack?e.error.stack.split('\n').slice(0,3).join(' | '):''); }catch(_){ }
});
function riffRoot(riff,i){
  for(let k=i;k>=0;k--) if(riff[k]!=null) return riff[k]>=100?riff[k]-100:riff[k];
  return 0;
}
/* --- track: level themes + unlockables (metal engine) --- */
function metalStep(s,t){
  const S=SONGS[curSongIdx()];
  const sec=['A','A','B','S'][Math.floor(s/32)%4];
  const riff=sec==='B'?S.riffB:S.riffA;
  const rvol=sec==='S'?0.12:0.2;
  const n=riff[s%32];
  if(n!=null){
    const semi=n>=100?n-100:n;
    const len=n>=100?S.tone.open:(semi===0?S.tone.mut:S.tone.mut*1.7);
    chug(E2*Math.pow(2,semi/12),t,len,rvol,n>=100,S.tone.f);
  }
  if(s%4===0)bassN(E1*Math.pow(2,riffRoot(riff,s%32)/12),t,stOf()*4);
  if(sec!=='S'){ const a=S.arp[s%16]; if(a!=null)arpN(E2*Math.pow(2,a/12),t,S); }
  if(sec==='S'){
    const l=S.solo[s%32];
    const heat=enemies.length>=3 || hEn.length>=3 || (boss&&!boss.dead&&!boss.entering);
    if(l!=null && heat){                             // solo only when ze fight is hot
      const nxt=S.solo[(s+1)%32];
      leadN(E2*Math.pow(2,l/12),t,nxt==null?0.34:stOf()*1.7);
    }
  }
  const K=(sec==='B'&&S.dblKick)?ALL16:S.kick;
  if(K[s%16])kickD(t);
  if(S.snare[s%16])snareD(t);
  hatD(t,s%2===0?0.11:0.045);
}
/* --- track: CHROME SUNSET (menu synthwave) --- */
function synthStep(s,t){
  const roots=[0,0,8,10], root=roots[Math.floor(s/16)%4];
  if(s%2===0)synthBass(E1*2*Math.pow(2,(root+((s>>1)%2)*12)/12),t);
  const AR=[12,15,19,24];
  arpN(E2*Math.pow(2,(root+AR[s%4])/12),t,{arpWave:'triangle',arpOct:2});
  if(s%32===0)padChord([root+12,root+15,root+19],t);
  if(Math.floor(s/16)%4>=2 && s%8===0){
    const ML=[24,22,19,24,27,24,22,19];
    leadN(E2*Math.pow(2,ML[(s>>3)%8]/12),t,0.3);
  }
  if(s%4===0)kickD(t);
  if(s%8===4)snareD(t);
  hatD(t,s%4===2?0.12:0.05);
}
/* --- track: EGO ENGINE (boss; flavor shifts per chassis) --- */
const BOSS_RIFF=[0,0,6,0, 0,0,6,0, 1,1,7,1, 0,0,6,0,
                 0,0,6,0, 0,0,8,0, 6,7,8,9, 6,1,6,0];
function bossStep(s,t){
  const v=curL().boss.type||'mk1';
  const n=BOSS_RIFF[s%32];
  if(n!=null)chug(E2*Math.pow(2,n/12),t,n===0?0.06:0.1,0.22,n===9,760);
  if(s%4===0)bassN(E1,t,stOf()*4);
  if(s%2===0)kickD(t);
  if(s%8===4)snareD(t);
  if(v==='mk2')hatD(t,[0.14,0.05,0.1,0.05][s%4]);  // rail-clatter hats
  else hatD(t,s%2?0.05:0.11);
  if(v==='mk1'&&s%48===0)siren(t);                  // air-raid dread
  if(v==='mk2'&&s%64===32)whistle(t);               // steam scream
  if(v==='mk3'&&s%32===0)ping(t);                   // sonar into the delay bus
  if(v==='mk4'&&s%40===0)howl(t);                   // arctic wind
  if(v==='mk5'&&s%56===0)klaxon(t);                 // cloning-vat alarm
  if(v==='mk6'&&s%64===0)voidPad(t);                // ze abyss
  if(v==='bell'){ if(s%64===0)bell(E2/2,t); if(s%16===10)noiseHit(t,'highpass',5200,0.06,0.09); }
  if(v==='eagle'&&s%48===0){ // screech
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(1900,t);
    o.frequency.exponentialRampToValueAtTime(620,t+0.4);
    g.gain.setValueAtTime(0.05,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.45);
    o.connect(g); g.connect(leadBus); o.start(t); o.stop(t+0.5);
  }
  if(v==='wolf'&&s%56===0){ // mechanical howl
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='sawtooth';
    o.frequency.setValueAtTime(440,t);
    o.frequency.linearRampToValueAtTime(880,t+0.5);
    o.frequency.linearRampToValueAtTime(392,t+1.1);
    g.gain.setValueAtTime(0.045,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+1.15);
    o.connect(g); g.connect(leadBus); o.start(t); o.stop(t+1.2);
  }
}
/* --- track: STAR-SPANGLED BASSDROP (public-domain melody, original synth arrangement) --- */
/* melody encoded as [semitone,duration-in-16ths] pairs, 3/4 phrasing with the
   dotted pickups intact: G.E | C E G | C' E'.D' | C' E.F# | G ~ G.G | E' D' C' |
   B A.B | C' C' G | E C  (public domain, 1814) */
const ANTHEM_SEQ=[[7,3],[4,1],[0,4],[4,4],[7,4],[12,8],[16,3],[14,1],[12,8],[4,2],[6,2],
                  [7,8],[7,3],[7,1],[16,4],[14,4],[12,4],[11,8],[9,3],[11,1],
                  [12,4],[12,4],[7,4],[4,4],[0,4],[null,28]];
const ANOTE=[],ALEN=[];
for(const e of ANTHEM_SEQ){
  ANOTE.push(e[0]); ALEN.push(e[1]);
  for(let k=1;k<e[1];k++){ ANOTE.push(null); ALEN.push(0); }
}
function anthemStep(s,t){
  const i=s%ANOTE.length;
  if(ANOTE[i]!=null)
    anthemLead(E2*4*Math.pow(2,ANOTE[i]/12),t,Math.max(0.2,ALEN[i]*stOf()*0.92));
  if(s%2===0)wob(E1,t,240+560*Math.abs(Math.sin(s*0.8))); // the wub
  if(s%8===0)kickD(t);
  if(s%16===8)snareD(t);
  hatD(t,0.05);
}
/* --- track: TAPS FOR TYRANTS' VICTIMS (game over dirge) --- */
function doomStep(s,t){
  if(s%16===0)bell(E2,t);
  if(s%16===8)bell(E2*0.7492,t);
  if(s%32===0){ swell(E1,t); swell(E1*1.0595,t+0.06); } // minor-2nd dread beating
  if(s%16===0)deepPulse(t);
  if(s%16===2)deepPulse(t);
}
/* --- dispatcher: game state picks the track --- */
function playStep(s,t){
  if(state==='splash'||state==='intro'){ doomSynthStep(s,t); return; }
  if(state==='post'){ cineStep(s,t); return; }
  if(state==='menu'||state==='charsel'||state==='vault'||state==='lvlsel'||state==='shop'||state==='ach'||state==='depot'||state==='optmenu'||state==='sound'||state==='merch'||state==='credits'||state==='hboard'||state==='galsel'){ synthStep(s,t); return; }
  if(state==='lvlwin'||state==='win'){ anthemStep(s,t); return; }
  if((state==='play'||state==='horde')&&typeof P!=='undefined'&&P&&P.star>0){ anthemStep(s,t); return; }
  if(state==='hwin'){ anthemStep(s,t); return; }
  if(state==='hover'){ doomStep(s,t); return; }
  if(state==='horde'){ hordeSynthStep(s,t); return; }
  if(state==='gal'){ galSynthStep(s,t); return; }
  if(state==='galwin'){ anthemStep(s,t); return; }
  if(state==='galover'){ doomStep(s,t); return; }
  if(state==='over'){ doomStep(s,t); return; }
  if(state==='pause')return; // hold ze silence
  if(typeof boss!=='undefined'&&boss){ if(!boss.dead)bossStep(s,t); return; } // silence over the wreck
  metalStep(s,t);
}
/* --- extra synth voices --- */
function synthBass(f,t){
  const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=f;
  lp.type='lowpass'; lp.frequency.value=520;
  g.gain.setValueAtTime(0.2,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.17);
  o.connect(lp); lp.connect(g); g.connect(master); o.start(t); o.stop(t+0.19);
}
function padChord(sems,t){
  for(const sm of sems){
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle'; o.frequency.value=E2*Math.pow(2,sm/12);

  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.001,t+len);
  for(const m of [1,1.4983]){
    const o=AC.createOscillator();
    o.type='sawtooth'; o.frequency.value=f*m; o.detune.value=(Math.random()*8-4);

  g.gain.exponentialRampToValueAtTime(0.001,t+len);

function blip(f0,f1,dur,type,vol){
  vol*=(opt.sfxv==null?1:opt.sfxv/10);
  if(vol<=0.001)return;
  if(!AC)return;
  const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(vol||0.14,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
}

function makeSpr(rows,pal){
  const h=rows.length, w=rows[0].length;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const ch=rows[y][x];
    if(ch!=='.'&&pal[ch]){ g.fillStyle=pal[ch]; g.fillRect(x,y,1,1); }
  }
  return c;
}

  if(th.civ)th.st='walk';                            // civs stroll; troops pop

  if(kind==='rocket'){ th.st='fly'; th.w=8; th.h=8; }
  if(kind==='hostage'){                              // civ + captor pair
    const hy=galFeet(0)-24;
    galThreats.push({kind:'civ',civ:1,x:x,y:hy,w:14,h:24,hp:1,st:'walk',t:0,

      win:o.win||560,vx:0,loop:0,pair:1,row:0});
    return;

function galAimAt(sx,sy,wpn){
  const WD=GALWPN[wpn||galWeapon], R=WD.rad;
  const pad=R>0?R:(R<0?R:2);
  const list=galThreats.slice().sort((a,b2)=>
    ((b2.kind==='captor')-(a.kind==='captor'))*1e6 + ((b2.y+b2.h)-(a.y+a.h)));
  for(const th of list){                             // pass 1: under ze reticle
    if(th.dead||th.st==='hide')continue;
    if(sx>th.x-pad&&sx<th.x+th.w+pad&&sy>th.y-pad&&sy<th.y+th.h+pad)return th;
  }
  if(WD.assist){                                     // pass 2: scope pulls to nearest
    let best=null,bd=WD.assist;
    for(const th of list){
      if(th.dead||th.st==='hide')continue;
      const d=Math.hypot(sx-(th.x+th.w/2),sy-(th.y+th.h/2));
      if(d<bd){ bd=d; best=th; }
    }
    if(best)return best;
  }
  return null;
}
function galShotAt(sx,sy){

  for(const th of list){

        galCivHit=1;

        for(const o2 of galThreats)if(o2.pair&&o2.civ)o2.dead=1;
        galScore+=2000; galGold+=5;
        galBan('HOSTAGE SAVED! +5 AU',110); sfxPick(); grant('galhost');
        break;
      }
      if(th.kind==='barrel'){
        th.dead=1; burst(th.x+6,th.y+8,22,'#ffa028'); sfxBoom(); galShake=6;
        if(th.rev)for(const rv of th.rev)galSpawn([0,rv[1],rv[2],rv[3],rv[4]]);
        for(const o2 of galThreats)
          if(!o2.dead&&!o2.civ&&o2.kind!=='lob'&&o2.kind!=='crate'&&
             Math.abs(o2.x-th.x)<40&&Math.abs(o2.y-th.y)<40){

          }

      }

      if(th.hp<=0)galKill(th,sx,sy);
      else { burst(sx,sy,4,'#f8f8f8'); }

  }

function galUpdate(){
  if(edge('pause')||edge('start')){
    pauseRet='gal'; setState('pause'); pauseSel=0; sfxMenu(); return;
  }
  if(stopT>0){ stopT--; return; }
  if(galTransit>0){
    galTransit--;
    if(galTransit%16===0)blip(180,140,0.04,'square',0.05); // footsteps
    if(galTransit===0&&galCur()&&galCur().ban)galBan(galCur().ban,100);
  } else galT++;
  if(galBanT>0)galBanT--;
  if(galFlash>0)galFlash--;
  if(galInv>0)galInv--;
  for(const id in galPtrs){
    if(id==='_p1')continue;
    const p2=galPtrs[id];
    if(!p2.down){ p2.up--; if(p2.up<=0)delete galPtrs[id]; }
  }
  if(galShake>0)galShake--;
  if(galReload>0){
    galReload--;
    if(galReload===0){
      galClip=GALWPN[galWeapon].clip;
      if(galWeapon!=='PISTOL'){
        galAmmo-=GALWPN[galWeapon].clip;
        if(galAmmo<=0){ galWeapon='PISTOL'; galClip=6; galBan('BACK TO ZE TRUSTY PISTOL',60); }
      }
      blip(500,800,0.06,'square',0.08);
    }
  }
  galDuck=keys.down||false;
  for(const id in galPtrs){
    if(id==='_p1')continue;
    const p2=galPtrs[id];
    if(p2.down&&p2.x<62&&p2.y>H-34)galDuck=true;
  }
  const heldShots=[];
  for(const s2 of galShotQ){
    if(s2.snp&&galReload>0){ heldShots.push(s2); continue; }  // sniper shot waits out reload
    if(s2.x<62&&s2.y>H-34)continue;
    if(s2.x>W-56&&s2.y>H-26){
      if(galClip<GALWPN[galWeapon].clip&&galReload<=0)galReload=12;
      continue;
    }
    if(!galDuck)galShotAt(s2.x,s2.y);
    else if(s2.snp)heldShots.push(s2);               // scoped shot waits out ze duck
    if(galMode===2&&s2.pid!==undefined&&galPtrs._p1===undefined)
      galPtrs._p1=s2.pid;
  }
  galShotQ.length=0;
  for(const s2 of heldShots)galShotQ.push(s2);
  if(GALWPN[galWeapon].auto&&galReload<=0&&!galDuck){
    for(const id in galPtrs){
      if(id==='_p1')continue;
      const p2=galPtrs[id];
      if(p2.down&&!(p2.x<62&&p2.y>H-34)&&tick%GALWPN[galWeapon].cd===0)
        galShotAt(p2.x,p2.y);
    }
    if(mouse.down&&tick%GALWPN[galWeapon].cd===0)galShotAt(mouse.x,mouse.y);
  }
  const sc=galCur();
  if(sc&&sc.ev)for(const ev of sc.ev)
    if(ev[0]===galT)galSpawn(ev);
  for(const th of galThreats){
    if(th.dead)continue;
    th.t++;
    if(th.kind==='rocket'){
      th.y+=1.15;                                    // longer fuse: more time to shoot it
      th.x+=th.vx;
      if(th.y>H-30){ th.dead=1; burst(th.x,th.y,14,'#ffa028'); galHurt(); }
      continue;
    }
    if(th.st==='idle')continue;
    if(th.kind==='ski'){
      th.x+=th.vx;
      if(th.x<-20||th.x>W+20)th.dead=1;
      if(th.t===th.win){ galFireAt(th); th.win+=140; }
      continue;
    }
    if(th.civ){ th.x+=th.vx; if(th.x<-20||th.x>W+20)th.dead=1; continue; }
    if(th.st==='pop'){ if(th.t>18){ th.st='aim'; th.t=0; } }
    else if(th.st==='aim'){
      if(th.t>=th.win){
        if(th.kind==='captor'){
          th.dead=1;
          for(const o2 of galThreats)if(o2.pair&&o2.civ)o2.dead=1;
          galBan('HOSTAGE DRAGGED AWAY...',110);
          galScore=Math.max(0,galScore-1000);
        } else if(th.pair&&th.civ){ th.dead=1; }
        else { galFireAt(th); th.st='hide'; th.t=0; th.fired++; }
      }
    }
    else if(th.st==='hide'){
      if(th.t>70&&th.loop){ th.st='aim'; th.t=0; th.win=Math.max(70,th.win-10); }
    }
  }
  galThreats=galThreats.filter(t2=>!t2.dead);
  for(const f2 of galFx)f2.t--;
  galFx=galFx.filter(f2=>f2.t>0);
  if(galBoss||galBanQT>0)galBossUpdate();
  if(galBossDelay>0){ galBossDelay--; if(galBossDelay===0)galNextScene(); }
  if(sc){
    const hostiles=galThreats.filter(t2=>!t2.civ&&t2.kind!=='lob'&&t2.kind!=='crate'&&t2.st!=='idle').length;
    const spawnsLeft=sc.ev?sc.ev.some(ev=>ev[0]>galT):false;
    const bossHold=!!sc.mini||!!sc.fin;
    if(bossHold&&!galBoss&&galBossDelay<=0&&!spawnsLeft&&hostiles===0&&galT>(sc.bossAt||1)){
      galBossStart(sc.mini||sc.fin,!!sc.fin);
    }
    if(!bossHold&&!spawnsLeft&&hostiles===0&&galT>60){
      galNextScene();
    }
    if(sc.max&&galT>sc.max)galNextScene();
  }
  if(lineT>0)lineT--;
}

function hSolid(x,y,w2,h2){

function hResolve(ent){

  const dy1=(o.y+o.h)-ent.y, dy2=(ent.y+ent.h)-o.y;
  if(Math.min(dx1,dx2)<Math.min(dy1,dy2))ent.x+=(dx1<dx2?dx1:-dx2);

function hLayout(){

             y:HY0+24+Math.random()*(HH-HY0*2-72),
             w:crate?22:14,h:crate?16:26,crate};

             y:HY0+30+Math.random()*(HH-HY0*2-90),

    if(hSolid(z.x-6,z.y-6,z.w+12,z.h+12))continue;

            const a3=Math.random()*6.283, r3=70+Math.random()*30;

            m.y=Math.max(HY0,Math.min(HY1-m.h,P.y+Math.sin(a3)*r3-m.h/2));
            burst(m.x+m.w/2,m.y+m.h/2,16,'#c8a0ff');
            blip(1200,300,0.2,'sine',0.12); shake=5;
          }
        } else if(m.dashT<40){ m.x+=m.dx*3.1; m.y+=m.dy*3.1; }
      } else {
        m.x+=ux*MP.spd; m.y+=uy*MP.spd;
        if(m.tm%Math.round(MP.dash*rate)===120){ m.dashT=64; m.dx=ux; m.dy=uy;
          blip(700,140,0.25,'sawtooth',0.12); }
      }
      if(m.tm%Math.round(MP.radT*rate)===0)          // radial burst
        for(let k=0;k<MP.radN;k++){
          const a2=k*(Math.PI*2/MP.radN)+(m.tm%2?Math.PI/MP.radN:0);
          hEb.push({x:m.x+m.w/2,y:m.y+m.h/2,vx:Math.cos(a2)*1.7,vy:Math.sin(a2)*1.7});
        }
      if(m.tm%Math.round(MP.volT*rate)===60)         // aimed volley
        for(const s2 of [0,7,14])
          hEb.push({x:m.x+m.w/2,y:m.y+m.h/2,vx:ux*2.4,vy:uy*2.4,dl:s2});
      if(m.tm-m.sumT>=Math.round(MP.sumT*rate) && hEn.length<3){
        m.sumT=m.tm;
        const sk=(m.phase===2&&MP.sumK==='troop')?'elite':MP.sumK;
        hSpawnE(sk); hSpawnE(sk);
      }
      m.x=Math.max(HX0,Math.min(HX1-m.w,m.x));
      m.y=Math.max(HY0,Math.min(HY1-m.h,m.y));
      hResolve(m);
      if(P.inv<=0 && !(P.x+P.w<m.x||P.x>m.x+m.w||P.y+P.h<m.y||P.y>m.y+m.h))hHurt();
    }
  }
  // --- enemies ---
  for(const z of hZap)
    if(hZapPhase(z)===2 && tick%20===0){
      if(P.inv<=0 && P.x+P.w>z.x&&P.x<z.x+z.w&&P.y+P.h>z.y&&P.y<z.y+z.h)hHurt();
      for(const e of hEn)
        if(!e.dead&&!e.warm&&e.x+e.w>z.x&&e.x<z.x+z.w&&e.y+e.h>z.y&&e.y<z.y+z.h){
          e.hp-=2; e.fl=2; burst(e.x+e.w/2,e.y+e.h/2,4,'#7df9ff');
          if(e.hp<=0)hKillE(e);
        }
    }
  for(const e of hEn){
    e.tm++;
    if(e.fl>0)e.fl--;
    if(e.warm>0){ e.warm--; continue; }              // phasing in: untouchable, harmless
    if(e.frz>0){ e.frz--; continue; }
    const dx=P.x+6-(e.x+e.w/2), dy=P.y+11-(e.y+e.h/2);
    const d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d;
    if(e.t==='troop'){ e.x+=ux*0.55; e.y+=uy*0.55;
      if(e.tm%150===0)hEb.push({x:e.x+7,y:e.y+10,vx:ux*1.9,vy:uy*1.9});
    }
    if(e.t==='ski'){ e.x+=ux*1.1+Math.sin(e.tm*0.15)*0.5*-uy; e.y+=uy*1.1+Math.sin(e.tm*0.15)*0.5*ux; }
    if(e.t==='klone'){ e.x+=ux*0.5; e.y+=uy*0.5; }
    if(e.t==='elite'){ e.x+=ux*0.7; e.y+=uy*0.7;
      if(e.tm%160<3&&e.tm%160%1===0&&(e.tm%160)%1===0&&e.tm%160===0)
        for(const s2 of [0,8,16])
          hEb.push({x:e.x+7,y:e.y+10,vx:ux*2.1,vy:uy*2.1,dl:s2});
    }
    if(e.t==='jag'){
      if(d>90){ e.x+=ux*0.6; e.y+=uy*0.6; }
      else if(d<60){ e.x-=ux*0.5; e.y-=uy*0.5; }
      if(e.tm%130===100)hEb.push({x:e.x+7,y:e.y+10,vx:ux*3.2,vy:uy*3.2});
    }
    if(e.t==='hound'){
      if(e.st<=0&&d<110){ e.st=54; e.lx=ux; e.ly=uy; }
      if(e.st>0){
        e.st--;
        if(e.st<36){ e.x+=e.lx*2.6; e.y+=e.ly*2.6; }
      } else { e.x+=ux*0.5; e.y+=uy*0.5; }
    }
    if(e.t==='tank'){ e.x+=ux*0.3; e.y+=uy*0.3;
      if(e.tm%180===0)
        for(const a2 of [-0.3,0,0.3]){
          const ca=Math.cos(a2), sa=Math.sin(a2);
          hEb.push({x:e.x+12,y:e.y+9,vx:(ux*ca-uy*sa)*1.8,vy:(ux*sa+uy*ca)*1.8});
        }
    }
    e.x=Math.max(HX0,Math.min(HX1-e.w,e.x));
    e.y=Math.max(HY0,Math.min(HY1-e.h,e.y));
    hResolve(e);
    if(P.rage>0 && Math.abs(P.x-e.x)<e.w && P.y+P.h>e.y-2 && P.y+P.h<e.y+8 && my>0){
      hKillE(e);
      if(!devMode){ SAVE.crush=(SAVE.crush|0)+1; if(SAVE.crush>=25)grant('stomp25'); }
      continue;
    }
    if(P.inv<=0 && !(P.x+P.w<e.x||P.x>e.x+e.w||P.y+P.h<e.y||P.y>e.y+e.h))hHurt();
  }
  if(hMini){
    const m=hMini;
    m.tm++;
    if(m.fl>0)m.fl--;
    if(m.warm>0){ m.warm--; }
    else if(m.frz>0){ m.frz--; }
    else {
      const dx=P.x+6-(m.x+m.w/2), dy=P.y+11-(m.y+m.h/2);
      const d=Math.hypot(dx,dy)||1, ux=dx/d, uy=dy/d;
      if(m.kind==='panzer'){
        m.x+=ux*0.4; m.y+=uy*0.4;
        if(m.tm%140===0)
          for(const a2 of [-0.35,0,0.35]){
            const ca=Math.cos(a2), sa=Math.sin(a2);
            hEb.push({x:m.x+m.w/2,y:m.y+m.h/2,vx:(ux*ca-uy*sa)*2.0,vy:(ux*sa+uy*ca)*2.0});
          }
        if(m.tm%230===110)
          for(let k=0;k<6;k++){
            const a2=k*Math.PI/3;
            hEb.push({x:m.x+m.w/2,y:m.y+m.h/2,vx:Math.cos(a2)*1.6,vy:Math.sin(a2)*1.6});
          }
      }
      if(m.kind==='alpha'){
        if(m.dash>0){
          m.dash--;
          if(m.dash<32){ m.x+=m.lx*3.0; m.y+=m.ly*3.0; }
        } else {
          m.x+=ux*0.7; m.y+=uy*0.7;
          if(m.tm%120===90){ m.dash=46; m.lx=ux; m.ly=uy;
            blip(900,300,0.12,'sawtooth',0.1); }
        }
        if(!m.half&&m.hp<m.max/2){
          m.half=true;
          hSpawnE('hound'); hSpawnE('hound');
          showLine('THE ALPHA CALLS ITS PACK');
        }
      }
      if(m.kind==='prime'){
        m.x+=ux*0.45; m.y+=uy*0.45;
        if(m.tm-m.sumT>=380 && hEn.filter(e=>e.t==='klone').length<2){
          m.sumT=m.tm; hSpawnE('klone');
        }
        if(m.tm%150===70)
          hEb.push({x:m.x+m.w/2,y:m.y+m.h/2,vx:ux*2.2,vy:uy*2.2});
      }
      m.x=Math.max(HX0,Math.min(HX1-m.w,m.x));
      m.y=Math.max(HY0,Math.min(HY1-m.h,m.y));
      hResolve(m);
      if(P.inv<=0 && !(P.x+P.w<m.x||P.x>m.x+m.w||P.y+P.h<m.y||P.y>m.y+m.h))hHurt();
    }
  }
  hEn=hEn.filter(e=>!e.dead);
  // --- enemy bullets ---
  for(const b of hEb){
    if(b.dl>0){ b.dl--; continue; }
    b.x+=b.vx; b.y+=b.vy;
    if(b.x<HX0-4||b.x>HX1+4||b.y<HY0-4||b.y>HY1+4||hSolid(b.x-1,b.y-1,2,2)){ b.dead=1; continue; }
    if(P.inv<=0&&b.x>P.x&&b.x<P.x+P.w&&b.y>P.y&&b.y<P.y+P.h){ b.dead=1; hHurt(b.frz); }
  }
  hEb=hEb.filter(b=>!b.dead);
  // --- player bullets (flat physics) ---
  for(const b of bullets){
    if(b.hcd>0)b.hcd--;
    if(b.orb){
      b.ang+=0.13; b.life--;
      b.x=P.x+6+Math.cos(b.ang)*22; b.y=P.y+10+Math.sin(b.ang)*22;
      if(b.life<=0)b.dead=1;
    } else {
      if(b.life){ b.life--; if(b.life<=0){ if(b.gren)hBoom(b); b.dead=1; continue; } }
      b.x+=b.vx; b.y+=b.vy;
      if(b.x<HX0-2||b.x>HX1+2||b.y<HY0-2||b.y>HY1+2||hSolid(b.x-1,b.y-1,2,2)){
        if(b.rocket||b.gren)hBoom(b);
        else if(hSolid(b.x-1,b.y-1,2,2))burst(b.x,b.y,3,'#8a8a96');
        b.dead=1; continue;
      }
    }
    for(const big of [hMini,hMech]){
      if(big&&!b.dead&&big.warm<=0&&(!b.orb||b.hcd<=0)&&
         b.x>big.x&&b.x<big.x+big.w&&b.y>big.y&&b.y<big.y+big.h){
        big.hp-=b.dmg; big.fl=2; stopT=Math.max(stopT,2);
        if(b.ice&&big===hMini)big.frz=60;
        if(big.hp<=0){ if(big===hMini)hKillMini(); else hKillMech(); }
        if(b.orb){ b.hcd=12; }
        else if(b.rocket||b.gren){ hBoom(b); b.dead=1; }
        else if(!b.pierce)b.dead=1;
        else burst(b.x,b.y,3,'#7df9ff');
      }
    }
    for(const e of hEn){
      if(!e.dead&&!b.dead&&(!b.orb||b.hcd<=0)&&
         b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){
        e.hp-=b.dmg; e.fl=2;
        if(b.ice)e.frz=100;
        if(e.hp<=0)hKillE(e);
        if(b.orb){ b.hcd=12; }
        else if(b.rocket||b.gren){ hBoom(b); b.dead=1; }
        else if(!b.pierce)b.dead=1;
        else burst(b.x,b.y,3,'#7df9ff');
      }
    }
  }
  bullets=bullets.filter(b=>!b.dead);
  // --- pickups ---
  for(const pk of hPk){
    pk.bob++;
    if(!(P.x+P.w<pk.x||P.x>pk.x+pk.w||P.y+P.h<pk.y||P.y>pk.y+pk.h))hCollect(pk);
  }
  hPk=hPk.filter(p2=>!p2.dead);
  if(lineT>0)lineT--;
  if(tick%20===0)refreshItemBtns();
}

  if(state==='post'){
    stateT++;
    if(stateT>40 && (edge('fire')||edge('start')||tap)){
      tap=null; postShot++; stateT=0;
      if(postShot>3){ postShot=0; setState('credits'); }
    }
    return;
  }
  if(state==='galwin'||state==='galover'){
    if(stateT>50){
      if(edge('fire')||tap){
        tap=null;
        if(state==='galwin'&&galLvl+1<GLV.length){ galResetLvl(galLvl+1); }
        else if(state==='galover'){ galContinue(); }
        else { galPadUI(false); setState('menu'); sfxMenu(); }
      } else if(edge('jump')||edge('start')){ galPadUI(false); setState('menu'); sfxMenu(); }
    }
    return;
  }
  if(state==='hwin'||state==='hover'){
    if(stateT>50){
      if(edge('fire')||tap){ tap=null; hordeNext=true; setState('charsel'); sfxPick(); }
      else if(edge('jump')||edge('start')){ hordeNext=false; setState('menu'); sfxMenu(); }
    }
    return;
  }
  if(state==='over'){
    overT++;
    if(overT>50){
      if(edge('fire')||edge('start')||tap){       // ze arcade continue
        tap=null; runPure=false;
        lives=3+(SAVE.own.canteen?1:0);
        runDeaths=0;
        startLevel(LVL); setState('play'); sfxPick();
      } else if(edge('jump')){ setState('menu'); sfxMenu(); }
    }
    return;
  }
  if(state==='win'){
    winT++;
    if(winT>50 && (edge('fire')||edge('start')||tap)){
      tap=null; postShot=0; setState('post');
    }
    return;
  }
}

function platPos(pl){
  if(!pl.sp)return {x:pl.x,y:pl.y};
  const t=tick*pl.sp+(pl.ph||0);
  return {x:pl.x+Math.sin(t)*(pl.mx||0), y:pl.y+Math.sin(t)*(pl.my||0)};
}
function platDelta(pl){
  if(!pl.sp)return {x:0,y:0};
  const t1=tick*pl.sp+(pl.ph||0), t0=(tick-1)*pl.sp+(pl.ph||0);
  return {x:(Math.sin(t1)-Math.sin(t0))*(pl.mx||0),
          y:(Math.sin(t1)-Math.sin(t0))*(pl.my||0)};
}

    lives--; runDeaths++; gore(P.x+5,P.y+9);
    if(!devMode){
      SAVE.tele.push({s:LVL,x:Math.round(P.x),c:P.lastHurt||'hit',w:P.weapon});
      while(SAVE.tele.length>200)SAVE.tele.shift();
    }
    if(lives<0){
      SAVE.kills+=runKills; runKills=0;
      SAVE.deaths+=runDeaths; runDeaths=0;
      saveSave(); checkStats();
      setState('over'); overT=0; return;
    }
    P.prone=false; P.h=24;
    if(P.weapon==='LIB')P.weapon='PEA'; // ze bell tolls no more
    let rx=Math.max(cam+16,40);
    while(overGap(rx,P.w))rx+=30;
    P.x=rx; P.y=GY-P.h; P.vy=0;
    P.hp=P.maxhp; P.inv=150;

}
function updateEnemies(){
  const rate=DIFF[opt.diff].rate;
  for(const p2 of patches){ p2.t--;
    if(p2.t%20===0)for(const e of enemies)
      if(!e.dead && Math.abs(e.x+e.w/2-p2.x)<15 && e.y+e.h>GY-6){
        e.hp--; burst(e.x+e.w/2,e.y+e.h/2,3,'#ff7828');
        if(e.hp<=0)onKill(e,ePts(e));
      }
  }
  patches=patches.filter(p2=>p2.t>0);
  for(const e of enemies){
    e.tm++;
    if(e.fl>0)e.fl--;
    if(e.lift>0){ // Newton's Nein: up, up, and away
      e.lift--; e.y-=1.4; e.x+=Math.sin(e.tm*0.3)*0.3;
      if(tick%4===0)parts.push({x:e.x+e.w/2,y:e.y+e.h,vx:0,vy:0.8,life:10,c:'#b0ff70'});
      if(e.y<-26)onKill(e,ePts(e));
      continue;
    }
    if(e.frz>0){ e.frz--; continue; } // frozen solid: no AI, no contact damage
    const dx=P.x+5-(e.x+e.w/2), dy=(P.y+10)-(e.y+e.h/2);
    const dist=Math.abs(dx), onscr=e.x>cam-8&&e.x<cam+W+8;
    if(e.t==='troop'||e.t==='elite'){
      const eo=e.t==='elite'; // officers: longer bursts, tighter positioning
      if(e.gy===GY){
        if(dist>(eo?105:95))e.x+=Math.sign(dx)*(eo?0.6:0.55);
        else if(dist<(eo?45:38))e.x-=Math.sign(dx)*0.45;
      }
      const Pd=Math.round((eo?150:130)*rate), ph=e.tm%Pd;
      if(onscr && ph<(eo?54:30) && ph%12===0){
        const m=Math.hypot(dx,dy)||1;
        ebul.push({x:e.x+3,y:e.y+9,vx:dx/m*2.5,vy:dy/m*2.5});
      }
    }
    if(e.t==='drone'){
      const swoop=(e.tm%200)>=140 && dist<90;    // periodic dive attack
      if(swoop){ e.x+=Math.sign(dx)*1.2; e.y+=Math.sign((P.y-8)-e.y)*1.1; }
      else { e.x-=0.7; e.y+=(e.y0+Math.sin(e.tm*0.06)*14-e.y)*0.08; }
      if(onscr && e.tm%Math.round(120*rate)===0) // bombs lead the target
        ebul.push({x:e.x+8,y:e.y+8,vx:Math.max(-1.4,Math.min(1.4,dx/70)),vy:0.8,grav:1});
    }
    if(e.t==='sentry'){
      const CH=Math.round(80*rate), per=CH+87, cyc=e.tm%per;
      if(cyc===CH) e.dir=Math.sign(dx)||-1;      // lock firing side
      if(cyc===CH+45) blip(2000,300,0.25,'sawtooth',0.2);
      if(cyc>=CH+45 && cyc<CH+57){
        const by=e.y+4;
        const inLane=P.y<by+2 && P.y+P.h>by-2;   // prone (h12) ducks under
        const inDir=(e.dir<0&&P.x+P.w<e.x)||(e.dir>0&&P.x>e.x+e.w);
        if(inLane&&inDir&&P.inv<=0) hurtPlayer();
      }
    }
    if(e.t==='ski'){ // winter division: fast closers, fire on the move
      e.x+=Math.sign(dx)*1.25;
      if(onscr && e.tm%Math.round(110*rate)===0){
        const m=Math.hypot(dx,dy)||1;
        ebul.push({x:e.x+3,y:e.y+9,vx:dx/m*2.6,vy:dy/m*2.6});
      }
    }
    if(e.t==='klone'){ // vat-grown: dumb, numerous, splits on death
      e.x+=Math.sign(dx)*0.7;
      if(onscr && e.tm%Math.round(150*rate)===0)
        ebul.push({x:e.x+3,y:e.y+9,vx:Math.sign(dx)*2.2,vy:0});
    }
    if(e.t==='jet'){ // raumtrooper: thrust pursuit
      e.vx=(e.vx||0)+Math.sign(dx)*0.05; e.vx*=0.98;
      e.vx=Math.max(-1.2,Math.min(1.2,e.vx));
      e.vy=(e.vy||0)+Math.sign((P.y-16)-e.y)*0.04; e.vy*=0.98;
      e.x+=e.vx; e.y+=e.vy+Math.sin(e.tm*0.1)*0.2;
      if(e.y>GY-30)e.y=GY-30;
      if(e.y<14)e.y=14;
      if(tick%4===0)parts.push({x:e.x+6,y:e.y+22,vx:0,vy:1.2,life:8,c:'#ffa028'});
      if(onscr && e.tm%Math.round(120*rate)===0){
        const m=Math.hypot(dx,dy)||1;
        ebul.push({x:e.x+6,y:e.y+12,vx:dx/m*2.4,vy:dy/m*2.4});
      }
    }
    if(e.t==='kult'){ // occultist: blinks around, hurls hexes
      const per=Math.round(190*rate);
      if(e.tm%per===0){
        burst(e.x+7,e.y+7,10,'#38f078');
        e.x=P.x+(Math.random()<0.5?-1:1)*(70+Math.random()*50);
        e.x=Math.max(cam+8,Math.min(cam+W-20,e.x));
        burst(e.x+7,e.y+7,10,'#38f078');
        blip(900,300,0.12,'triangle',0.09);
      }
      if(onscr && e.tm%Math.round(120*rate)===60){
        const m=Math.hypot(dx,dy)||1;
        ebul.push({x:e.x+7,y:e.y+5,vx:dx/m*1.8,vy:dy/m*1.8,hex:1});
      }
    }
    if(e.t==='jag'){ // alpine sniper: tracking laser, then the shot
      const per=Math.round(170*rate), ph=e.tm%per;
      if(ph<50)e.aim={x:P.x+6,y:P.y+10};
      if(ph===60 && onscr && e.aim){
        const adx=e.aim.x-(e.x+7), ady=e.aim.y-(e.y+9);
        const m=Math.hypot(adx,ady)||1;
        ebul.push({x:e.x+7,y:e.y+9,vx:adx/m*4.2,vy:ady/m*4.2});
        blip(1800,500,0.08,'square',0.14);
      }
      if(ph>60)e.aim=null;
    }
    if(e.t==='hound'){ // blitz-hund: crouch telegraph, then the lunge
      if(e.st===0){
        e.x+=Math.sign(dx)*0.4;
        if(dist<130 && e.tm%40===0){ e.st=1; e.stT=32; e.dir=Math.sign(dx)||-1; }
      } else if(e.st===1){
        e.stT--;
        if(e.stT===20)blip(160,90,0.2,'sawtooth',0.12); // growl
        if(e.stT<=0){ e.st=2; e.stT=36; }
      } else {
        e.stT--; e.x+=e.dir*3.2;
        if(tick%2===0)parts.push({x:e.x+10,y:GY-2,vx:-e.dir,vy:-0.6,life:8,c:'#5a4a3a'});
        if(e.stT<=0){ e.st=0; e.tm=1; }
      }
    }
    if(e.t==='mine'){ // proximity mine: shoot from range or regret
      if(e.armT<0 && dist<28 && Math.abs(dy)<30)e.armT=30;
      if(e.armT>=0){
        e.armT--;
        if(e.armT%10===0)blip(1400,1400,0.03,'square',0.1);
        if(e.armT===0){
          e.dead=1; rocketBoom({x:e.x+6,y:e.y});
          if(Math.hypot(P.x+6-(e.x+6),P.y+12-e.y)<26 && P.inv<=0)hurtPlayer();
        }
      }
    }
    if(e.t==='frog'){ // swimming melee: relentless underwater pursuit
      e.fc=Math.sign(dx)||e.fc;
      const nx=e.x+e.fc*0.75;
      if(inWaterZone(nx+8))e.x=nx;
      e.y+=Math.sign(dy)*0.55+Math.sin(e.tm*0.15)*0.35;
      if(e.y<waterY()+2)e.y=waterY()+2;
      if(e.y>H-16)e.y=H-16;
      if(tick%20===0)parts.push({x:e.x+8,y:e.y-2,vx:0,vy:-1,life:22,c:'#bde8ff',b:1});
    }
    if(e.t==='tank'){
      if(dist>125)e.x+=dx>0?0.3:-0.32;           // close to range, then hold
      else if(onscr && e.tm%Math.round(140*rate)===0){
        ebul.push({x:e.x+4,y:e.y,vx:Math.max(-2.4,Math.min(2.4,dx/58)),vy:-2.6,grav:1});
        blip(120,50,0.12,'sawtooth',0.12);       // arcing mortar shells
      }
    }
    if(P.rage>0 && P.vy>1 && e.t!=='mine' &&
       P.x+P.w>e.x && P.x<e.x+e.w &&
       P.y+P.h>e.y-2 && P.y+P.h<e.y+10){              // BOOST STOMP: crushed
      onKill(e,ePts(e));
      if(!devMode){ SAVE.crush=(SAVE.crush|0)+1; if(SAVE.crush>=25)grant('stomp25'); }
      burst(e.x+e.w/2,e.y+4,14,'#ffe848'); sfxBoom(); shake=5;
      P.vy=-3.4;
      continue;
    }
    if(BLOCKERS[e.t] && aabb(P,e)){                  // no hiding inside ze hero
      e.x+=(Math.sign((e.x+e.w/2)-(P.x+P.w/2))||1)*1.5;
    }
    if(e.t!=='mine' && P.inv<=0 && aabb(P,e)) hurtPlayer('melee');
  }
  enemies=enemies.filter(e=>e.x>cam-60 && !e.dead);
}
const BLOCKERS={troop:1,elite:1,ski:1,klone:1,hound:1,tank:1,jag:1};
const EPTS={tank:500,sentry:400,kult:350,elite:300,jag:300,jet:250,hound:220,frog:200,
            ski:150,drone:150,klone:120,troop:100,mine:50};
function ePts(e){ return EPTS[e.t]||100; }
const STREAKS={2:'DOUBLE LIBERTY!',3:'TRIPLE FREEDOM!',4:'EAGLE STORM!',
  5:'FREEDOM FRENZY!',7:'DEMOCRACY MANIFEST!',10:'ABSOLUTE LIBERATOR!'};
function onKill(e,pts){
  e.dead=1; score+=pts;
  if(stopT===0)stopT=3;                             // kills freeze ze frame
  if(tick-lastKillT<48)killStreak++; else killStreak=1;
  lastKillT=tick;
  if(STREAKS[killStreak]){
    showLine(STREAKS[killStreak]); score+=killStreak*25;
    blip(880,1320,0.09,'square',0.09);
    blip(1320,1760,0.09,'square',0.07);             // radio squawk
  }
  { const r=Math.random(); let k=null;                 // battlefield drops
    if(e.t==='tank'&&r<0.35)k='shield';
    else if(e.t==='sentry'&&r<0.3)k='dmg';
    else if((e.t==='elite'||e.t==='jag'||e.t==='kult')&&r<0.22)k='gren';
    else if(r<0.02)k='invinc';
    if(k)pickups.push({x:e.x+e.w/2-5,y:Math.min(e.y,GY-14),w:10,h:10,kind:k,bob:tick%9});
  } runKills++;
  if(e.t==='mine'){
    rocketBoom({x:e.x+6,y:e.y});
    if(Math.hypot(P.x+6-(e.x+6),P.y+12-e.y)<26 && P.inv<=0)hurtPlayer();
  }
  if(e.t==='klone' && !e.gen && Math.random()<0.4){ // mitosis!
    for(const off of [-12,14])
      enemies.push({t:'klone',x:e.x+off,y:e.y,w:14,h:24,hp:1,
                    tm:(Math.random()*40)|0,gy:e.gy||GY,gen:1});
    if(lineT<=0)showLine('IT SPLIT?! THE CLONES HAVE CLONES!');
  }
  gore(e.x+e.w/2, e.y+e.h/2); sfxBoom(); shake=Math.max(shake,3);
  if(lineT<=0 && Math.random()<0.4) showLine(LINES[(Math.random()*LINES.length)|0]);
}
function rocketBoom(b){
  const R=b.big?36:26, D=(b.big?6:4)+(P&&P.rage>0?2:0);
  burst(b.x,b.y,R,'#ffa028'); sfxBoom(); shake=b.big?9:6;
  rumble(90,0.4,0.8);
  for(const e of enemies)
    if(!e.dead && Math.abs(e.x+e.w/2-b.x)<R && Math.abs(e.y+e.h/2-b.y)<R){
      e.hp-=D;
      if(e.hp<=0){
        onKill(e, ePts(e));
        if(b.gren&&!devMode){ SAVE.nadeK=(SAVE.nadeK|0)+1; if(SAVE.nadeK>=50)grant('nade50'); }
      }
    }
  if(boss && !boss.dead && Math.abs(boss.x+boss.w/2-b.x)<boss.w/2+18 &&
     Math.abs(boss.y+boss.h/2-b.y)<boss.h/2+18){
    if((curL().boss.type||'mk1')==='mk5'){
      const hd=boss.heads.find(h=>h.hp>0);
      if(hd){hd.hp-=(b.big?6:4);boss.hp=boss.heads.reduce((a2,h2)=>a2+Math.max(0,h2.hp),0);}
    } else boss.hp-=(b.big?6:4);
    boss.flash=6;
  }
}
function updateBullets(){
  for(const b of bullets){
    if(b.hcd>0)b.hcd--;
    if(b.orb){ // satellites circle the player
      b.ang+=0.13; b.life--;
      b.x=P.x+6+Math.cos(b.ang)*22;
      b.y=P.y+10+Math.sin(b.ang)*22;
      if(b.life<=0)b.dead=1;
    } else {
      if(b.axe){
        if(!b.ret){ b.vx*=0.955; b.vy+=0.06; if(Math.abs(b.vx)<0.7)b.ret=1; }
        else{
          const ddx=P.x+6-b.x, ddy=P.y+10-b.y, m2=Math.hypot(ddx,ddy)||1;
          b.vx=ddx/m2*4.2; b.vy=ddy/m2*4.2;
          if(m2<10){ b.dead=1; continue; } // caught
        }
      }
      if(b.grav)b.vy+=0.16;
      if(b.life){ b.life--; if(b.life<=0){ b.dead=1; continue; } }
      b.x+=b.vx; b.y+=b.vy;
      if(b.echo>0){ // yodel off the walls
        let ec=false;
        if(b.x<cam+2){ b.x=cam+2; b.vx=Math.abs(b.vx); ec=true; }
        if(b.x>cam+W-2){ b.x=cam+W-2; b.vx=-Math.abs(b.vx); ec=true; }
        if(b.y<2){ b.y=2; b.vy=Math.abs(b.vy); ec=true; }
        if(b.y>GY-3){ b.y=GY-3; b.vy=-Math.abs(b.vy); ec=true; }
        if(ec){ b.echo--; blip(500,750,0.08,'triangle',0.07); }
      }
    }
    if(b.bounce && b.y>=GY-3 && !inWaterZone(b.x)){ b.y=GY-3; b.vy=-Math.abs(b.vy)*0.85; }
    if(!b.harp && !b.rail && b.y>waterY() && inWaterZone(b.x)){
      b.vx*=0.96; b.vy*=0.96;
      if(Math.hypot(b.vx,b.vy)<0.7)b.dead=1;
    }
    if(!b.orb && !b.axe && !(b.echo>0) &&
       (b.x<cam-8||b.x>cam+W+8||(b.y>GY-2&&!b.bounce&&!inWaterZone(b.x))||b.y>H+8)){
      if(b.rocket||b.gren)rocketBoom(b);
      if(b.hot&&patches.length<6){ patches.push({x:b.x,t:130}); burst(b.x,GY-3,8,'#ff7828'); sfxBoom(); }
      b.dead=1; continue; }
    for(const e of enemies){
      if(!e.dead && !b.dead && (!(b.orb||b.axe)||b.hcd<=0) &&
         b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){
        e.hp-=b.dmg; runStats.hits++; e.fl=2;
        if(b.ice)e.frz=100;
        if(b.grv && e.t!=='mine'){ e.lift=100; b.dead=1; blip(300,1200,0.2,'triangle',0.1); continue; }
        if(e.hp<=0) onKill(e, ePts(e));
        if(b.orb||b.axe){ b.hcd=b.axe?10:12; burst(b.x,b.y,2,b.axe?'#c8b090':'#7df9ff'); }
        else if(b.rocket||b.gren){rocketBoom(b);b.dead=1;}
        else if(b.hot){ if(patches.length<6){patches.push({x:b.x,t:130});} rocketBoom(b); b.dead=1; }
        else if(!b.pierce) b.dead=1;
        else burst(b.x,b.y,3,'#7df9ff');
      }
    }
    if(boss && !boss.dead && !b.dead && (!b.orb||b.hcd<=0)){
      const bt2=curL().boss.type||'mk1';
      let hit=false;
      if(bt2==='mk5'){
        for(const hd of boss.heads){
          if(hd.hp>0 && b.x>boss.x+hd.off&&b.x<boss.x+hd.off+20&&
             b.y>boss.y-24&&b.y<boss.y+2){
            hd.hp-=b.dmg; boss.flash=5; hit=true;
            if(hd.hp<=0){burst(boss.x+hd.off+10,boss.y-12,20,'#ffa028');sfxBoom();shake=8;}
            break;
          }
        }
        if(!hit && b.x>boss.x&&b.x<boss.x+boss.w&&b.y>boss.y&&b.y<boss.y+boss.h){
          hit=true; blip(200,80,0.04,'square',0.05); // armor clink, heads only
        }
        if(hit)boss.hp=boss.heads.reduce((a2,h2)=>a2+Math.max(0,h2.hp),0);
      }
      else if(b.x>boss.x&&b.x<boss.x+boss.w&&b.y>boss.y&&b.y<boss.y+boss.h){
        boss.hp-=(b.grv?3:b.dmg); boss.flash=5; hit=true; runStats.hits++;
      }
      if(hit){
        stopT=Math.max(stopT,2);                    // boss hits land HEAVY
        if(b.rocket||b.gren)rocketBoom(b);
        if(b.orb){ b.hcd=12; } else b.dead=1;
        blip(160,60,0.05,'square',0.08);
      }
    }
  }
  bullets=bullets.filter(b=>!b.dead);
  for(const b of ebul){
    if(b.grav)b.vy+=0.09;
    b.x+=b.vx; b.y+=b.vy;
    if(b.y>GY-1){ b.dead=1; burst(b.x,GY-2,4,'#ff7828'); }
    if(b.x<cam-10||b.x>cam+W+10)b.dead=1;
    if(!b.dead && P.inv<=0 && b.x>P.x&&b.x<P.x+P.w&&b.y>P.y&&b.y<P.y+P.h){
      b.dead=1; hurtPlayer('shot');
      if(b.frz)P.slowT=80;
    }
  }
  ebul=ebul.filter(b=>!b.dead);
}
function bossMk1(rate,p2){ // hover, volleys, stomps, eye lasers

function updateBoss(){
  if(!boss)return;
  if(boss.dead){
    boss.dieT++;
    if(boss.dieT%9===0){
      burst(boss.x+Math.random()*boss.w, boss.y+Math.random()*boss.h, 14,'#ffa028');
      sfxBoom(); shake=6;
    }
    if(boss.dieT>150){
      bankGold();
      if(LVL>=LEVELS.length-1){
        SAVE.wins++; grant('beat1');
        if(SAVE.wins>=3)grant('beat3');
        if(runPure)grant('ironrun');
        if(runDeaths===0&&runPure)grant('nodeath');
        if(opt.gore)grant('gorewin');
        if(opt.gore&&runRescues>=LEVELS.length)grant('rescue');
        saveSave();
      }
      setState(LVL<LEVELS.length-1?'lvlwin':'win'); winT=0;
    }
    return;
  }
  if(boss.entering){                                 // ze dramatic roll-up
    // roll to wherever is VISIBLE right now; the fight AI re-anchors after banter
    const tgt=Math.min(boss.anchor, cam+W-boss.w-8);
    if(boss.x>tgt){
      boss.x=Math.max(tgt, boss.x-2.4);
      if(tick%7===0){
        shake=Math.max(shake,2);
        parts.push({x:boss.x+boss.w/2,y:GY-2,vx:-(0.5+Math.random()),vy:-0.6,life:14,c:'#8a8a92'});
      }
    }
    if(boss.x<=tgt+0.5){
      boss.entering=false;
      blip(180,90,0.3,'sawtooth',0.14); shake=9;     // arrival THUD
    }
    return;
  }
  if(boss.dlg && boss.dlgIx<boss.dlg.length){        // ze banter phase
    boss.dlgT++; P.cd=Math.max(P.cd,6);
    const adv=(edge('fire')&&boss.dlgT>10)||(tap&&boss.dlgT>10)||boss.dlgT>190
             ||(keys.fire&&boss.dlgT>7);            // hold A to speed-skip
    if(adv){
      tap=null; boss.dlgIx++; boss.dlgT=0;
      blip(880,660,0.05,'square',0.07);
      if(boss.dlgIx>=boss.dlg.length)showLine(curL().boss.intro);
    }
    return;
  }
  if(bossIntroT>0){ bossIntroT--; return; }
  boss.tm++;
  const p2=boss.hp<boss.max/2;
  if(p2 && boss.phase===1){ boss.phase=2; showLine(curL().boss.rage); }
  const rate=(p2?0.62:1)*DIFF[opt.diff].rate;
  const bt=curL().boss.type||'mk1';
  if(bt==='mk2')bossMk2(rate,p2);
  else if(bt==='mk3')bossMk3(rate,p2);
  else if(bt==='mk4')bossMk4(rate,p2);
  else if(bt==='mk5')bossMk5(rate,p2);
  else if(bt==='mk6')bossMk6(rate,p2);
  else if(bt==='bell')bossBell(rate,p2);
  else if(bt==='eagle')bossEagle(rate,p2);
  else if(bt==='wolf')bossWolf(rate,p2);
  else bossMk1(rate,p2);
  if(boss.flash>0)boss.flash--;
  if(boss.hp<=0){ boss.dead=1; boss.dieT=0; showLine(curL().boss.death); rumble(450,1,1); }
  if(P.inv<=0 && aabb(P,boss)) hurtPlayer();
}
function update(){
  pollPad();
  if(shake>0)shake--; // decay everywhere, incl. game-over screen
  if(state==='horde'){ hordeUpdate(); PK=Object.assign({},keys); tap=null; return; }
  if(state==='gal'){ galUpdate(); PK=Object.assign({},keys); tap=null; return; }
  if(state!=='play'){ updateFrontend(); PK=Object.assign({},keys); tap=null; return; }
  if(edge('pause')||edge('start')){
    pauseRet='play'; setState('pause'); pauseSel=0; sfxMenu();
    PK=Object.assign({},keys); tap=null; return;
  }
  if(stopT>0){ stopT--; return; } // hitstop: world freezes, but ze inputs survive to fire on resume
  if(tick%20===0)refreshItemBtns();
  spawnEnemies(); updatePlayer();
  if(state==='play'){
    updateEnemies(); updateBullets(); updateBoss();
    for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.b?-0.02:0.12; p.life--; }
    parts=parts.filter(p=>p.life>0);
    for(const d of decals)d.life--;
    decals=decals.filter(d=>d.life>0);
    if(lineT>0)lineT--;
  }
  PK=Object.assign({},keys); tap=null;
}

function txt(t,x,y,c,size,align){
  t=String(t).toUpperCase().replace(/\u00dc/g,'U');
  const sz=size||8;
  const sc=sz<=8?1:(sz<=14?2:(sz<=22?3:4));
  const cw=4*sc, w=t.length*cw-sc;
  x=Math.round(x); y=Math.round(y)-5*sc;
  if(align==='center')x-=Math.round(w/2);
  if(align==='right')x-=w;
  cx.fillStyle=c||'#f8f8f8';
  for(let i=0;i<t.length;i++){
    const g=FONT[t[i]];
    if(!g)continue;
    for(let r=0;r<5;r++)for(let col=0;col<3;col++)
      if(g[r*3+col]==='1')cx.fillRect(x+i*cw+col*sc,y+r*sc,sc,sc);
  }
}

// Invented "Ego Sigil" crest — a gear-toothed sun ring with a mustache bar.
// Deliberately NOT the Black Sun / Schwarze Sonne (a real, banned hate symbol).
function egoSigil(cx0,cy0,r,col){
  cx.strokeStyle=col; cx.lineWidth=1;
  cx.beginPath(); cx.arc(cx0,cy0,r,0,7); cx.stroke();
  cx.beginPath(); cx.arc(cx0,cy0,r*0.6,0,7); cx.stroke();
  for(let k=0;k<12;k++){                     // gear teeth / rays
    const a=k*Math.PI/6;
    cx.beginPath();
    cx.moveTo(cx0+Math.cos(a)*r,cy0+Math.sin(a)*r);
    cx.lineTo(cx0+Math.cos(a)*(r+3),cy0+Math.sin(a)*(r+3));
    cx.stroke();
  }
  cx.fillStyle=col;                          // the 'stache
  cx.fillRect(cx0-r*0.4,cy0-1,r*0.8,2);
}
function drawBGCastle(){
  rect(0,0,W,H,'#0a0812');                    // night
  cx.fillStyle='#141020';

function drawScope(x,y){                            // aim = finger; lens hovers ABOVE it
  const r=30, z=2.4, s=r*2/z;
  const ly=Math.max(r+4,y-52);                       // lens center, clamped on-screen
  cx.save();
  cx.beginPath(); cx.arc(x,ly,r,0,7); cx.clip();
  cx.imageSmoothingEnabled=false;
  cx.drawImage(cv, Math.max(0,Math.min(W-s,x-s/2)),Math.max(0,Math.min(H-s,y-s/2)),s,s,
               x-r,ly-r,r*2,r*2);
  cx.fillStyle='rgba(10,6,18,0.12)'; cx.fillRect(x-r,ly-r,r*2,r*2);
  cx.restore();
  cx.strokeStyle='#16121a'; cx.lineWidth=3;
  cx.beginPath(); cx.arc(x,ly,r,0,7); cx.stroke();
  cx.strokeStyle='#7df9ff'; cx.lineWidth=1;
  cx.beginPath(); cx.arc(x,ly,r,0,7); cx.stroke();
  rect(x-r+3,ly,r-8,1,'#7df9ff'); rect(x+5,ly,r-8,1,'#7df9ff');
  rect(x,ly-r+3,1,r-8,'#7df9ff'); rect(x,ly+5,1,r-8,'#7df9ff');
  const lock=galAimAt(x,y);
  if(lock&&!lock.civ){                               // ZE SCOPE HAS IT
    const lx2=x+(lock.x+lock.w/2-x)*z, lyy=ly+(lock.y+lock.h/2-y)*z;
    cx.strokeStyle=(tick>>2)%2?'#38c848':'#ffe848'; cx.lineWidth=1;
    cx.strokeRect(lx2-9,lyy-11,18,22);
    txt('LOCK',x,ly+r-4,'#38c848',5,'center');
  } else if(lock&&lock.civ){
    cx.strokeStyle='#ff5040'; cx.lineWidth=1;
    cx.strokeRect(x-10,ly-12,20,24);
    txt('CIVILIAN!',x,ly+r-4,'#ff5040',5,'center');
  }
  rect(x-1,ly-1,3,3,'#ff5040');                      // magnified aim point
  txt('2.4x',x+r-4,ly-r+8,'#7df9ff',5,'right');
  if(ly<y-6){                                        // tether to ze actual finger
    rect(x,ly+r,1,Math.max(0,y-8-(ly+r)),'rgba(125,249,255,0.5)');
    cx.strokeStyle='#ff5040'; cx.lineWidth=1;
    cx.beginPath(); cx.arc(x,y,4,0,7); cx.stroke();
  }
}

function wrapTxt(s,max){
  const out=[]; let cur='';
  for(const w2 of s.split(' ')){
    if((cur+' '+w2).trim().length>max){ out.push(cur.trim()); cur=w2; }
    else cur+=' '+w2;
  }
  if(cur.trim())out.push(cur.trim());
  return out;
}

  txt(('000000'+score).slice(-6),W-6,13,'#f8f8f8',8,'right');
  if(curL().waterY && P.o2<600){
    rect(78,5,100,8,'#101018');
    rect(79,6,Math.max(0,98*P.o2/600),6,(P.o2<150&&(tick>>3)%2)?'#ff2020':'#38a8e8');
    txt('O2',66,12,'#bde8ff',7);
  }
  if(boss&&!boss.dead&&bossIntroT<=0){
    rect(48,H-16,160,7,'#101018');
    rect(48,H-16,160,1,'#584870');
    { const ratio=Math.max(0,boss.hp/boss.max), col=boss.phase===2?'#ff2020':'#d82800';
      for(let k2=0;k2<10;k2++){                      // armor plates, not a health smoothie
        const fill=Math.max(0,Math.min(1,ratio*10-k2));
        if(fill>0)rect(49+k2*16,H-15,Math.round(15*fill),5,col);
        rect(49+k2*16,H-15,15,1,'rgba(255,255,255,0.18)');
      } }
    for(let i=1;i<4;i++)rect(48+i*40,H-15,1,5,'#101018');
    txt(curL().boss.name,W/2,H-19,'#ff5040',7,'center');
  }
  if(lineT>0){
    cx.globalAlpha=Math.min(1,lineT/20);
    const tw=Math.min(W-8,line.length*5.2+12);
    rect(W/2-tw/2,34,tw,13,'#101018');
    rect(W/2-tw/2,34,tw,1,'#ffe848');
    rect(W/2-tw/2,46,tw,1,'#ffe848');
    txt(line,W/2,43,'#ffe848',7,'center');
    cx.globalAlpha=1;
  }
}
function drawPickup(pk){
  const px=pk.x-cam, py=pk.y+Math.sin(pk.bob)*3;
  if(px<-20||px>W)return;
  if(pk.kind==='wpn'){
    rect(px,py,12,12,'#8a5a28'); rect(px+1,py+1,10,10,'#b8823c');
    txt(pk.wp[0],px+6,py+9,'#181008',7,'center');
  }
  if(pk.kind==='heart'){
    rect(px+1,py,3,3,'#d82800'); rect(px+6,py,3,3,'#d82800');
    rect(px,py+2,10,4,'#d82800'); rect(px+2,py+6,6,2,'#d82800');
    rect(px+4,py+8,2,2,'#d82800');
  }
  if(pk.kind==='life'){
    rect(px,py+3,10,5,'#ffe848'); rect(px+3,py,4,10,'#ffe848');
    rect(px+4,py+4,2,2,'#d82800');
  }
  if(pk.kind==='gold'){
    rect(px,py+2,10,6,'#c8a018'); rect(px+1,py+1,8,3,'#ffe848');
  }
  if(pk.kind==='shield'){                              // blue plate vest
    rect(px+1,py,8,3,'#2858b0'); rect(px,py+2,10,7,'#3878e8');
    rect(px+2,py+4,6,1,'#9ac8ff'); rect(px+2,py+6,6,1,'#9ac8ff');
  }
  if(pk.kind==='invinc'){                              // ze star
    const c2=(tick>>2)%2?'#ffe848':'#f8f8f8';
    rect(px+4,py,2,10,c2); rect(px,py+4,10,2,c2);
    rect(px+2,py+2,6,6,c2); rect(px+4,py+4,2,2,'#d82800');
  }
  if(pk.kind==='dmg'){                                 // up-fist of freedom
    rect(px+3,py,4,4,'#ff5040'); rect(px+1,py+3,8,4,'#d82800');
    rect(px+2,py+7,6,3,'#a82010'); rect(px+4,py+1,2,2,'#ffe848');
  }
  if(pk.kind==='gren'){                                // ze pineapple
    rect(px+2,py+2,6,8,'#38c848'); rect(px+3,py+3,4,2,'#2a9838');
    rect(px+3,py+6,4,2,'#2a9838'); rect(px+4,py,2,2,'#909890');
  }
  if(pk.kind==='air'){
    for(let k=0;k<3;k++){
      const bx2=px+k*5, by2=py+Math.sin(pk.bob+k)*2;
      cx.fillStyle='rgba(189,232,255,0.8)';
      cx.beginPath(); cx.arc(bx2+2,by2+4,((k+((tick>>4)%3))%3===0)?2:3,0,7); cx.fill();
    }
  }
  if(pk.kind==='babe'){
    drawSpr(sprBabe,px,py,false);
    cx.fillStyle='#282430';
    for(let bx=0;bx<5;bx++)cx.fillRect(Math.round(px)-1+bx*4,Math.round(py)-2,2,22); // cage
    rect(px-2,py-3,18,2,'#282430'); rect(px-2,py+18,18,2,'#282430');
    if((tick>>4)%2)txt('HELP!',px+7,py-6,'#ffe848',6,'center');
  }
}
function render(){
  cx.save();
  if(shake>0&&opt.shake)cx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  if(state==='splash'){ drawSplash(); cx.restore(); return; }
  if(state==='intro'){ drawIntro(); cx.restore(); return; }
  if(state==='menu'){ drawMenu(); cx.restore(); return; }
  if(state==='charsel'){ drawCharsel(); cx.restore(); return; }
  if(state==='vault'){ drawVault(); cx.restore(); return; }
  if(state==='post'){ drawPost(); cx.restore(); return; }
  if(state==='lvlsel'){ drawLvlSel(); cx.restore(); return; }
  if(state==='shop'){ drawShop(); cx.restore(); return; }
  if(state==='ach'){ drawAch(); cx.restore(); return; }
  if(state==='depot'){ drawSubList('SUPPLY DEPOT',DEPOT); cx.restore(); return; }
  if(state==='optmenu'){ drawSubList('OPTIONS',OPTM,'\u2190\u2192 ADJUST \u00b7 B: BACK'); cx.restore(); return; }
  if(state==='sound'){ drawSubList('SOUND TEST',SOUNDL(),'A: EQUIP FOR MISSIONS \u00b7 B: BACK'); cx.restore(); return; }
  if(state==='merch'){ drawMerch(); cx.restore(); return; }
  if(state==='hboard'){ drawSubList('HALL OF PATRIOTS',HBL(),'B: BACK'); cx.restore(); return; }
  if(state==='credits'){ drawCredits(); cx.restore(); return; }
  if(state==='horde'){
    drawHorde(); cx.restore();
    if(opt.crt)cx.drawImage(crtCv,0,0);
    return;
  }
  if(state==='gal'){
    drawGal(); cx.restore();
    if(opt.crt)cx.drawImage(crtCv,0,0);
    return;
  }
  if(state==='galwin'||state==='galover'){
    drawGal(); drawGalEnd(); cx.restore();
    if(opt.crt)cx.drawImage(crtCv,0,0);
    return;
  }
  if(state==='galsel'){ drawSubList(GALNAME+' \u00b7 1-2 PLAYERS',GALSEL(),'A: DEPLOY \u00b7 B: BACK'); cx.restore(); return; }
  if(state==='pause'&&pauseRet==='gal'){
    drawGal(); drawPause(); cx.restore();
    if(opt.crt)cx.drawImage(crtCv,0,0);
    return;
  }
  if(state==='pause'&&pauseRet==='horde'){          // paused IN ze arena: show ze arena
    drawHorde(); drawPause(); cx.restore();
    if(opt.crt)cx.drawImage(crtCv,0,0);
    return;
  }
  if(state==='hwin'||state==='hover'){
    drawHorde(); drawHordeEnd(); cx.restore();
    if(opt.crt)cx.drawImage(crtCv,0,0);
    return;
  }
  drawBG();
  drawSigns();
  drawGaps();
  for(const d of decals){ // blood pools (gore mode)
    cx.globalAlpha=Math.min(0.7,d.life/300);
    rect(d.x-cam,GY,d.w,3,'#801010');
    cx.globalAlpha=1;
  }
  for(const pl of PLATS){
    const pp=platPos(pl), px=pp.x-cam;
    if(px>-140&&px<W){
      rect(px,pp.y,pl.w,6,'#584870'); rect(px,pp.y,pl.w,2,'#8878a8');
      if(pl.sp){ rect(px+pl.w/2-1,0,2,pp.y,'#2e2a3855'); rect(px+pl.w/2-1,0,2,pp.y,'rgba(46,42,56,0.4)'); } // crane cable
    }
  }
  for(const p2 of patches){
    const fx=p2.x-cam;
    if(fx>-16&&fx<W+16)
      for(let k=0;k<4;k++){
        const fh=4+((tick+k*3)%6);
        rect(fx-7+k*4,GY-fh,3,fh,(k+((tick>>2)%2))%2?'#ff7828':'#ffe848');
      }
  }
  for(const pk of pickups)drawPickup(pk);
  for(const e of enemies){
    const ex=e.x-cam;
    if(ex<-30||ex>W+10)continue;
    if(e.t==='troop')drawSpr(((e.tm>>3)%2)?sprTroopA:sprTroopB,ex-2,e.y,false);
    if(e.t==='elite')drawSpr(((e.tm>>3)%2)?sprEliteA:sprEliteB,ex-2,e.y,false);
    if(e.t==='frog') drawSpr(((e.tm>>3)%2)?sprFrogA:sprFrogB,ex,e.y-1,e.fc>0);
    if(e.t==='ski')  drawSpr(((e.tm>>2)%2)?sprSkiA:sprSkiB,ex-2,e.y,false);
    if(e.t==='klone')drawSpr(((e.tm>>3)%2)?sprKloneA:sprKloneB,ex-2,e.y,e.gen?false:false);
    if(e.t==='kult'){
      drawSpr(sprKult,ex-1,e.y,false);
      if((tick>>3)%2)rect(ex+5,e.y-3,4,2,'#38f078');
    }
    if(e.t==='jag'){
      drawSpr(((e.tm>>3)%2)?sprJagA:sprJagB,ex-2,e.y,false);
      if(e.aim){
        cx.strokeStyle='rgba(255,32,32,0.55)'; cx.lineWidth=1;
        cx.beginPath(); cx.moveTo(ex+7,e.y+9);
        cx.lineTo(e.aim.x-cam,e.aim.y); cx.stroke();
        rect(e.aim.x-cam-1,e.aim.y-1,3,3,'rgba(255,32,32,0.7)');
      }
    }
    if(e.t==='hound'){
      const crouch=e.st===1?2:0;
      drawSpr(((e.st===2?(tick>>1):(e.tm>>3))%2)?sprHndA:sprHndB,ex,e.y+crouch,e.dir>0);
    }
    if(e.t==='mine'){
      rect(ex,e.y+2,12,4,'#3a3226');
      rect(ex+2,e.y,8,3,'#4a4234');
      const fast=e.armT>=0;
      if((tick>>(fast?1:4))%2)rect(ex+5,e.y-1,2,2,fast?'#ff2020':'#8a2020');
    }
    if(e.t==='jet'){
      drawSpr(sprJet,ex-2,e.y,false);
      rect(ex+11,e.y+6,4,10,'#50505c');
      if((tick>>1)%2)rect(ex+12,e.y+16,2,3,'#ffa028');
    }
    if(e.fl>0){ // impact frame: white silhouette pop
      cx.fillStyle='rgba(255,255,255,0.85)';
      cx.fillRect(ex-1,e.y,e.w+2,e.h);
    }
    if(e.frz>0){ // flash-frozen
      cx.fillStyle='rgba(150,220,255,0.45)';
      cx.fillRect(ex-2,e.y-1,e.w+4,e.h+2);
      if(e.frz<20&&(tick>>2)%2){cx.fillStyle='rgba(255,255,255,0.3)';cx.fillRect(ex-2,e.y-1,e.w+4,e.h+2);}
    }
    if(e.t==='drone')drawSpr(sprDrone,ex,e.y-1,false);
    if(e.t==='tank') drawSpr(sprTank,ex,e.y,false);
    if(e.t==='sentry'){
      rect(ex+1,e.y+8,12,12,'#2e2a38');
      rect(ex+3,e.y+20,8,2,'#17141f');
      drawSpr(sprSentry,ex-1,e.y,e.dir>0);
      const rate=DIFF[opt.diff].rate;
      const CH=Math.round(80*rate), per=CH+87, cyc=e.tm%per, by=e.y+4;
      if(cyc>=CH && cyc<CH+45 && (tick>>2)%2){   // warning line
        cx.fillStyle='rgba(255,32,32,0.5)';
        if(e.dir<0)cx.fillRect(0,by,Math.max(0,ex),1);
        else cx.fillRect(ex+16,by,W-ex-16,1);
      }
      if(cyc>=CH+45 && cyc<CH+57){               // THE BEAM
        cx.fillStyle='#b8f0ff';
        if(e.dir<0)cx.fillRect(0,by-1,Math.max(0,ex),3);
        else cx.fillRect(ex+16,by-1,W-ex-16,3);
        cx.fillStyle='#ffffff';
        if(e.dir<0)cx.fillRect(0,by,Math.max(0,ex),1);
        else cx.fillRect(ex+16,by,W-ex-16,1);
        if(tick%2===0)burst(e.x+(e.dir<0?-4:18),by,2,'#b8f0ff');
      }
    }
  }
  if(boss){
    const bt=curL().boss.type||'mk1';
    if(bt==='mk2')
      drawLoco(Math.round(boss.x-cam),Math.round(boss.y),boss.phase,boss.flash);
    else if(bt==='mk3'){
      drawTents();
      drawUboot(Math.round(boss.x-cam),Math.round(boss.y),boss.phase,boss.flash);
    }
    else if(bt==='mk4')drawFrost(Math.round(boss.x-cam),Math.round(boss.y),boss.phase,boss.flash);
    else if(bt==='mk5')drawHydra(Math.round(boss.x-cam),Math.round(boss.y),boss.phase,boss.flash);
    else if(bt==='mk6')drawEgo(Math.round(boss.x-cam),Math.round(boss.y),boss.phase,boss.flash);
    else if(bt==='bell')drawBell(Math.round(boss.x-cam),Math.round(boss.y),boss.phase,boss.flash);
    else if(bt==='eagle')drawEagle(Math.round(boss.x-cam),Math.round(boss.y),boss.phase,boss.flash);
    else if(bt==='wolf')drawWolf(Math.round(boss.x-cam),Math.round(boss.y),boss.phase,boss.flash);
    else drawBossAt(Math.round(boss.x-cam),Math.round(boss.y),boss.phase,boss.flash,false);
    if(!boss.dead){                                  // visible structural failure
      const r=boss.hp/boss.max, bx2=boss.x-cam, by2=boss.y;
      if(r<0.5){                                     // dented + smoking
        for(const [ox,oy] of [[0.22,0.3],[0.62,0.55],[0.4,0.78]])
          rect(Math.round(bx2+boss.w*ox),Math.round(by2+boss.h*oy),4,3,'#16121a');
        if(tick%6===0)parts.push({x:boss.x+boss.w*0.3,y:by2+boss.h*0.22,
          vx:-0.2,vy:-0.5,life:28,c:'#3a3a42',b:1});
      }
      if(r<0.25){                                    // on fire, arguing about it
        for(let k2=0;k2<2;k2++){
          const fx2=Math.round(bx2+boss.w*(0.28+k2*0.36)), fh2=3+((tick+k2*5)%5);
          rect(fx2,Math.round(by2+boss.h*0.42)-fh2,3,fh2,
               (k2+((tick>>2)%2))%2?'#ff7828':'#ffe848');
        }
        if(tick%3===0)parts.push({x:boss.x+boss.w*0.6,y:by2+boss.h*0.3,
          vx:0.2,vy:-0.8,life:20,c:'#ff7828',b:1});
        if(tick%11===0)burst(boss.x+Math.random()*boss.w,by2+Math.random()*boss.h*0.6,2,'#ffe848');

    }
  }
  if(P.inv%6<3){
    const S=CHARS[charSel].spr;
    if(P.prone){
      drawSpr(S.P,P.x-cam-8,P.y,P.face<0);
    } else {
      const s=!P.og?(P.vy<0?S.J:S.F[0])              // rise: tucked / fall: legs out
             :(Math.abs(P.vx)>0.1?S.F[((P.walkT/2.6)|0)%4]:S.F[2]);
      const rx=P.mf>0?-P.face:0;                     // recoil lean
      const iy=(P.idle>300&&(tick>>4)%2)?1:0;        // idle: patient foot-tap bob
      drawSpr(s,P.x-cam-4+rx,P.y-2+iy,P.face<0);
    }
    { // ze one true gun: solid barrel at any angle, recoil-aware
      const rec=P.mf>0?1.6:0;
      const gx=P.x-cam+6+P.face*2-P.ax*rec;
      const gy=P.y+(P.prone?7:10)-P.ay*rec;
      cx.fillStyle='#3a3a44';
      for(let i=0;i<7;i++)
        cx.fillRect(Math.round(gx+P.ax*i*1.4)-1,Math.round(gy+P.ay*i*1.4)-1,3,3);
      cx.fillStyle='#8a8a96';                       // SNES top highlight
      for(let i=1;i<6;i++)
        cx.fillRect(Math.round(gx+P.ax*i*1.4)-1,Math.round(gy+P.ay*i*1.4)-2,2,1);
      rect(Math.round(gx+P.ax*9.8)-1,Math.round(gy+P.ay*9.8)-1,3,3,'#14141a'); // muzzle
    }
    if(P.mf>0){ // directional flash: core + forward tongue + perp sparks
      const mx=P.x-cam+6+P.ax*13, my=P.y+(P.prone?7:11)+P.ay*11;
      rect(mx-1,my-1,3,3,'#f8f8f8');
      rect(mx-1+Math.round(P.ax*3),my-1+Math.round(P.ay*3),2,2,'#ffe848');
      rect(mx-1-Math.round(P.ay*2),my-1+Math.round(P.ax*2),2,2,'#ffe848');
      rect(mx-1+Math.round(P.ay*2),my-1-Math.round(P.ax*2),2,2,'#ffe848');
    }
    if(P.star>0){                                     // red, white & bulletproof
      if(opt.flash&&(tick>>1)%2){
        cx.globalAlpha=0.35;
        cx.fillStyle=['#ff4040','#f8f8f8','#4060ff'][(tick>>2)%3];
        cx.fillRect(P.x-cam-3,P.y-3,P.w+6,P.h+6);
        cx.globalAlpha=1;
      } else if(!opt.flash){
        cx.globalAlpha=0.18; cx.fillStyle='#f8f8f8';
        cx.fillRect(P.x-cam-3,P.y-3,P.w+6,P.h+6);
        cx.globalAlpha=1;
      }
    }
    if(P.rage>0&&(tick>>2)%2){
      cx.globalAlpha=0.25; cx.fillStyle='#ff3c1e';
      cx.fillRect(P.x-cam-2,P.y-2,P.w+4,P.h+4);
      cx.globalAlpha=1;
    }
  }
  for(const b of bullets){
    const bw=b.flame?4:(b.rocket?5:3), bh=b.flame?4:(b.rocket?3:2);
    if(!b.orb&&!b.flame&&(b.vx||b.vy)){              // motion streak
      cx.globalAlpha=0.35;
      rect(b.x-cam-1-b.vx*1.1,b.y-1-b.vy*1.1,bw-1,bh,b.c);
      cx.globalAlpha=1;
    }
    rect(b.x-cam-1,b.y-1,bw,bh,b.c);
    if(b.rail){
      rect(b.x-cam-1-b.vx,b.y-1-b.vy,3,2,'#7dd8ff');
      rect(b.x-cam-1-b.vx*2,b.y-1-b.vy*2,3,2,'#4aa8d8');
    }
    if(b.grv){ cx.strokeStyle='#b0ff70'; cx.lineWidth=1;
      cx.beginPath(); cx.arc(b.x-cam,b.y,4,0,7); cx.stroke(); }
    if(b.axe){ // spinning axe
      const a2=tick*0.5;
      rect(b.x-cam-1+Math.cos(a2)*3,b.y-1+Math.sin(a2)*3,3,3,'#d8d8e0');
      rect(b.x-cam-1-Math.cos(a2)*3,b.y-1-Math.sin(a2)*3,3,3,'#8a6a3c');
    }
    if(b.harp){ // spear shaft + steel tip
      rect(b.x-cam-1-b.vx*0.8,b.y-1-b.vy*0.8,3,2,'#8a6a3c');
      rect(b.x-cam-1-b.vx*1.6,b.y-1-b.vy*1.6,3,2,'#8a6a3c');
      rect(b.x-cam,b.y-1,2,2,'#d8d8e0');
    }
    if(b.rocket&&tick%2===0)parts.push({x:b.x-b.vx*2,y:b.y,vx:0,vy:-0.2,life:8,c:'#ff7828'});
  }
  for(const b of ebul){
    if(b.torp){
      cx.fillStyle='#8a94a0';
      cx.fillRect(Math.round(b.x-cam-4),Math.round(b.y-1),9,3);
      cx.fillStyle='#d82800';
      cx.fillRect(Math.round(b.x-cam-4),Math.round(b.y),2,1);
      if(tick%3===0)parts.push({x:b.x+6,y:b.y,vx:0.4,vy:-0.3,life:14,c:'#bde8ff',b:1});
      continue;
    }
    cx.fillStyle=b.steam?'#e8e8f0':(b.frz?'#bde8ff':(b.hot2?'#ff7828':(b.hex?'#38f078':'#ff5040')));
    const bs=(b.steam||b.hot2||b.hex)?4:3;
    cx.fillRect(Math.round(b.x-cam-1),Math.round(b.y-1),bs,bs);
  }
  for(const p of parts){cx.fillStyle=p.c;cx.fillRect(Math.round(p.x-cam),Math.round(p.y),2,2);}
  if(curL().lavaZones){ // molten surface
    const ly=lavaY();
    for(const z of curL().lavaZones){
      const zx=z.x-cam;
      const x0=Math.max(0,zx), x1=Math.min(W,zx+z.w);
      if(x1>x0){
        const lg=cx.createLinearGradient(0,ly,0,H);
        lg.addColorStop(0,'#ffb040'); lg.addColorStop(0.15,'#ff7828'); lg.addColorStop(1,'#8a2808');
        cx.fillStyle=lg; cx.fillRect(x0,ly,x1-x0,H-ly);
        cx.fillStyle='#ffe848';
        for(let i2=0;i2<5;i2++){
          const bx3=x0+((i2*23+(tick>>1))% Math.max(1,(x1-x0)));
          cx.fillRect(bx3,ly-1,4,2);
        }
      }
    }
  }
  if(curL().lifts)for(const l of curL().lifts){ // occult updraft columns
    const lx=l.x-cam;
    if(lx>-l.w&&lx<W+l.w){
      cx.fillStyle='rgba(176,255,112,0.10)'; cx.fillRect(lx,0,l.w,GY);
      cx.fillStyle='rgba(176,255,112,0.5)';
      for(let k=0;k<5;k++){
        const sy=(GY-((tick*3+k*40+l.x)% (GY+20)));
        cx.fillRect(lx+6+((k*13)%(l.w-8)),sy,2,6);
      }
      rect(lx,GY-2,l.w,2,'#3a5a28');
    }
  }
  if(gustNow()){ // alpine wind streaks
    const gd=gustNow();
    cx.fillStyle='rgba(220,235,250,0.22)';
    for(let i=0;i<14;i++){
      const sy=(i*17+tick*2)%H, len=10+((i*7+tick)%16);
      const sx=((i*53+tick*gd*5)%(W+40))-20;
      cx.fillRect(sx,sy,gd>0?len:-len<0?len:len,1);
    }
    txt(gd>0?'\u2192 GUST \u2192':'\u2190 GUST \u2190',W/2,14,'rgba(220,235,250,0.5)',7,'center');
  }
  if(curL().blizzard){ // whiteout gusts + driving snow
    cx.fillStyle='#f0f6fc';
    for(let i=0;i<34;i++){
      const sx3=((i*67+tick*3)%(W+30))-15, sy3=(i*41+tick*2)%H;
      cx.fillRect(sx3,sy3,3,1);
    }
    const gust=0.05+0.18*Math.max(0,Math.sin(tick*0.005));
    cx.fillStyle='rgba(230,240,250,'+gust.toFixed(3)+')';
    cx.fillRect(0,0,W,H);
  }
  if(curL().lifts){ // occult anti-grav updraft columns
    for(const l of curL().lifts){
      const lx=l.x-cam;
      if(lx>-l.w&&lx<W){
        const lg=cx.createLinearGradient(0,0,0,GY);
        lg.addColorStop(0,'rgba(176,255,112,0.02)');
        lg.addColorStop(1,'rgba(176,255,112,0.16)');
        cx.fillStyle=lg; cx.fillRect(lx,0,l.w,GY);
        cx.fillStyle='rgba(200,255,150,0.5)';
        for(let s=0;s<5;s++){
          const sy=(GY-((tick*3+s*47+l.x)%GY));
          cx.fillRect(lx+3+((s*13+l.x)%(l.w-6)),sy,2,4);
        }
      }
    }
  }
  if(gustNow()){ // wind streak lines
    const gd=gustNow();
    cx.strokeStyle='rgba(232,220,234,0.28)'; cx.lineWidth=1;
    for(let i=0;i<10;i++){
      const yy=(i*22+tick*4)%H, x0=(i*90+tick*7*gd)%(W+60)-30;
      cx.beginPath(); cx.moveTo(x0,yy); cx.lineTo(x0+gd*22,yy); cx.stroke();
    }
  }
  if(curL().waterY){
    const wy=curL().waterY;
    for(const z of curL().waterZones||[]){
      const zx=z.x-cam;
      const x0=Math.max(0,zx), x1=Math.min(W,zx+z.w);
      if(x1>x0){
        cx.fillStyle='rgba(30,90,140,0.35)';
        cx.fillRect(x0,wy,x1-x0,H-wy);
      }
    }
    cx.fillStyle='rgba(180,230,255,0.5)';
    for(let i=0;i<12;i++){
      const sx2=((i*24+tick)%(W+24))-12;
      if(inWaterZone(sx2+cam))cx.fillRect(sx2,wy+Math.round(Math.sin(tick*0.1+i)),10,1);
    }
  }
  drawFG();
  drawHUD();
  if(boss&&!boss.entering&&boss.dlg&&boss.dlgIx<boss.dlg.length)drawBossDlg();
  if(state==='pause')drawPause();
  if(state==='over'){
    rect(0,70,W,70,'rgba(16,16,24,0.85)');
    txt('GAME OVER',W/2,72,'#d82800',18,'center');
    txt('THE REICH LAUGHS. FOR NOW.',W/2,88,'#c8c8e8',7,'center');
    const acc=runStats.shots?Math.round(runStats.hits/runStats.shots*100):0;
    txt('TIME '+fmtT(tick-runStats.t0)+' \u00b7 KILLS '+runKills+' \u00b7 ACC '+acc+'%',W/2,106,'#8878a8',7,'center');
    txt('GOLD '+(runStats.gold+runGold)+' \u00b7 DEATHS '+runDeaths,W/2,118,'#8878a8',7,'center');
    txt('A: CONTINUE (SECTOR '+(LVL+1)+')',W/2,138,'#ffe848',8,'center');
    txt('B: QUIT TO MENU',W/2,152,'#c8c8e8',7,'center');
  }
  if(state==='lvlwin'){
    rect(0,60,W,100,'rgba(16,16,24,0.9)');
    txt('SECTOR '+(LVL+1)+' CLEARED',W/2,88,'#ffe848',13,'center');
    txt(curL().boss.name+': SCRAPPED',W/2,104,'#8878a8',7,'center');
    txt('SCORE: '+score,W/2,116,'#f8f8f8',9,'center');
    txt(devMode?'DEV RUN \u00b7 GOLD NOT BANKED':'GOLD RECOVERED: '+runGold+' BARS \u2192 VAULT',W/2,128,devMode?'#7df9ff':'#ffe848',7,'center');
    { const tk='++ '+TICKERS[(LVL+SAVE.wins+runDeaths)%TICKERS.length]+' ++';
      const tw=tk.length*6+W;
      txt(tk,W-((winT*1.3)%tw),H-6,'#584870',6); }
    let cy=140;
    if(LVL===2){
      txt('GUTPUNCH: "HE\'S DIGGING UP HIS OLD TOYS.',W/2,cy,'#ff9838',6,'center');
      txt('THE OLD RUINS ARE ACTIVE. STAY SHARP."',W/2,cy+8,'#ff9838',6,'center'); cy+=20;
    }
    for(const c of CHEATS){
      const rv=(c.revealAt==='final')?(LEVELS.length-1):c.revealAt;
      if(rv===LVL && (c.type!=='warp'||c.v<LEVELS.length)){
        txt(c.label+' CODE: '+seqGlyphs(c.seq),W/2,cy,'#38c848',7,'center'); cy+=11;
      }
    }
    txt('(WRITE THEM DOWN, SOLDIER)',W/2,cy,'#38c848',7,'center');
    if(winT>50&&(tick>>4)%2)txt('PRESS FIRE FOR NEXT SECTOR',W/2,cy+16,'#ffe848',7,'center');
  }
  if(state==='win'){
    rect(0,50,W,120,'rgba(16,16,24,0.9)');
    txt('EGO PRIME: SCRAPPED',W/2,74,'#ffe848',13,'center');
    txt('RANK: '+rankOf(score),W/2,92,'#38c848',9,'center');
    const acc2=runStats.shots?Math.round(runStats.hits/runStats.shots*100):0;
    txt('TIME '+fmtT(tick-runStats.t0)+' \u00b7 ACC '+acc2+'% \u00b7 DEATHS '+runDeaths,W/2,104,'#8878a8',6,'center');
    txt('SCORE: '+score,W/2,110,'#f8f8f8',9,'center');
    let wy=122;
    for(const c of CHEATS){
      const rv=(c.revealAt==='final')?(LEVELS.length-1):c.revealAt;
      if(rv===LVL && (c.type!=='warp'||c.v<LEVELS.length)){
        txt(c.label+' CODE: '+seqGlyphs(c.seq),W/2,wy,'#38c848',7,'center'); wy+=10;
      }
    }
    txt(CHARS[charSel].name+' WILL RETURN IN',W/2,wy+6,'#8878a8',7,'center');
    txt('"MOON REICH 2: ELECTRIC BOOGALOO"',W/2,wy+16,'#8878a8',7,'center');
    if(winT>50&&(tick>>4)%2)txt('PRESS FIRE',W/2,wy+30,'#ffe848',7,'center');
  }
  cx.restore();
}

/* ------------------------- MAIN LOOP ------------------------- */
let crtCv=document.createElement('canvas');
(function buildCRT(){
  crtCv.width=W; crtCv.height=H;
  const g=crtCv.getContext('2d');
  g.fillStyle='rgba(0,0,0,0.22)';
  for(let y=0;y<H;y+=2)g.fillRect(0,y,W,1);
  const v=g.createRadialGradient(W/2,H/2,80,W/2,H/2,195);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,0.4)');
  g.fillStyle=v; g.fillRect(0,0,W,H);
})();
function loop(){
  requestAnimationFrame(loop);
  tick++;
  update();
  render();
  if(opt.crt)cx.drawImage(crtCv,0,0);
}
loop();
</script>
</body>
</html>
